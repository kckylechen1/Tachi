[store]
dir = "target/nextest"

# NOTE: timeout values below are PROVISIONAL. They were seeded from a
# calibration run on 2026-07-06 (see PR #682) rather than from long-run p99
# telemetry, since this repo has no such telemetry yet. Re-tune once nextest
# has accumulated a few weeks of real CI history
# (`cargo nextest run --workspace --locked` timing, or the JUnit report at
# `target/nextest/ci/junit.xml`).
[profile.default]
# Warn (not fail) once a test has been running this long, so a slow-but-alive
# test is visible in output without being killed.
slow-timeout = { period = "20s", terminate-after = 6 }
# terminate-after = 6 -> hard cap at 6 * 20s = 120s per test. The slowest
# known tests in this workspace are bounded polling loops (~6s worst case,
# see crates/tachi-server/src/tests/dispatch_tests/mod.rs
# DISPATCH_TEST_WAIT_ATTEMPTS/DISPATCH_TEST_WAIT_INTERVAL). 120s gives ~20x
# headroom over that before nextest terminates and names the offender -- this
# is the mechanism issue #682 wants for the class of hang diagnosed in #505
# (FTS tokenizer contention), so a genuine future hang is killed and reported
# instead of stalling the whole suite for minutes.
default-filter = "all()"

[profile.ci]
slow-timeout = { period = "20s", terminate-after = 6 }
failure-output = "immediate-final"
success-output = "never"
status-level = "fail"
final-status-level = "flaky"
# Retries absorb environment-sensitive flakes (issue #1261) without masking
# real bugs. The CI-discovered flakes all stem from CI-runner-specific
# behavior (overlayfs inode reuse, container PID-namespace kill() semantics,
# fork+exec pipe timing) that does not reproduce deterministically within a
# single attempt but also does not indicate a product defect. A genuine bug
# fails three times in a row; a flake lands as `flaky` in the final status
# (still visible via `final-status-level = "flaky"` above) without aborting
# the whole run. Without this, one flake cancels ~2684 remaining tests
# (observed: 896/3581 run, 1 failed, rest cancelled) and blocks every PR
# that happens to hit the flaky order.
retries = 2

# JUnit timing telemetry (Refs #1095): the ci profile writes a machine-readable
# JUnit report at this path (the location the header comment above already
# advertises). Each <testcase time="..."> records the pure test-BODY duration
# (nextest measures only execution, never compile/link), so in CI the step's
# wall-time minus the report's summed test time cleanly separates compile/link
# cost from test-execution cost -- the two are no longer conflated. The report
# is archived by the `Archive nextest JUnit timing report` step in
# .github/workflows/ci.yml via actions/upload-artifact (no third-party action).
# NOTE: `path` resolves relative to the profile's store dir
# (target/nextest/ci/), so a bare filename lands the report at
# target/nextest/ci/junit.xml -- a repo-relative path here would double-nest.
[profile.ci.junit]
path = "junit.xml"

# Used by scripts/nextest-census.sh (#1278 step ①) to capture one JUnit
# report per run for repeat-failure-signature accumulation.
#
# retries = 0 is load-bearing, not an oversight: the `ci` profile's
# retries = 2 exists specifically to absorb flakes so they don't cancel the
# rest of the run -- but that absorption makes a retried-away failure never
# reach the JUnit report at all, so the census (which exists to *count*
# failures, including flaky ones, by signature) would silently undercount
# exactly the class of test it is built to observe. Do not copy `retries`
# from `[profile.ci]` here.
[profile.census]
slow-timeout = { period = "20s", terminate-after = 6 }
failure-output = "immediate-final"
success-output = "never"
status-level = "fail"
final-status-level = "flaky"
retries = 0

# NOTE: `path` resolves relative to the profile's store dir
# (target/nextest/census/), so a bare filename lands the report at
# target/nextest/census/junit.xml.
[profile.census.junit]
path = "junit.xml"

# Known deterministic reds for the machine-readable gate (#1278 / shift #1383 T5).
# The roster is currently EMPTY: the last two members (tests::dispatch_tests::
# board_first x2) were re-verified GREEN on 2026-08-05 and removed; the third
# historical member's test was deleted on main by 280983bea (#1319 C2).
# `scripts/nextest-known-reds-diff.sh` still diffs JUnit failures against this
# group and exits nonzero on any outsider — with an empty roster, ANY failure
# is an outsider, which is exactly the contract a clean main should hold.
#
# To re-admit a known red: add anchored [[profile.default.overrides]] AND
# [[profile.ci.overrides]] entries (#1413 concern 5: EXACT full nextest test
# paths, `^...$`-anchored — substring filters would silently absorb future
# tests into the group and turn genuine new reds into false OKs).
#
# Parallel slow-test roster (see scripts/nextest-slow-roster.txt and
# scripts/nextest-slow-diff.sh) lives outside test-groups; it is a separate
# operator/local gate (like the local gitleaks hook), NOT invoked by CI
# (Actions disabled repo-wide per #1562). Run manually:
#   cargo nextest run -p tachi-server -p memory-server-runtime --locked \
#     --final-status-level slow > /tmp/slow.txt 2>&1
#   scripts/nextest-slow-diff.sh /tmp/slow.txt
#   # (or with --profile ci). The gate requires a successful terminal Summary;
#   # failed, interrupted, and truncated captures are refused.
[test-groups]
known-deterministic-reds = { max-threads = "num-cpus" }
