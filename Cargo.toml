[workspace]
members = [
    "crates/memcore",
    "crates/memory-node",
    "crates/tachi-server",
    "crates/tachi-params",
    "crates/memory-server-runtime",
    # Portable kernel facade: memcore without admin (vault/hub/foundry/pack).
    # Hosts consume this shared graph; domain adapters do not fork its implementation.
    "crates/portable-kernel",
    # Stripped server profile (bin): serves the portable kernel over MCP stdio
    # (save/search/get/status), no operator/product surfaces. Companion to the
    # portable-kernel library for the HyperMem runtime cutover.
    "crates/portable-server",
    "crates/tachi-bootstrap",
    # Test crates stay in the workspace and out of default-members.
    "crates/tachi-contract-tests",
    "crates/tachi-bootstrap-tests",
    "crates/tachi-delivery-tests",
    "crates/tachi-vault-tests",
    "crates/tachi-credential-profile",
    "crates/tachi-dispatch",
    "crates/tachi-foundry",
    "crates/tachi-build-broker",
    # Report-only orphan build-artifact reaper (#894 S2b), carved out of
    # tachi-server with its complete safety/certification test suite.
    "crates/tachi-exec-env-reaper",
    "crates/tachi-hub",
    "crates/tachi-llm",
    # Leaf utilities; dependency contracts forbid server/domain dependencies.
    "crates/tachi-runtime-core",
    # Vault crypto + versioned KDF-parameter format leaf crate, extracted
    # for cross-product reuse (tachi#1080 v1: crypto+format only, store
    # stays product-local). Depends on nothing else in this workspace.
    "crates/vault-kit",
    "tools/cleaner",
    "tools/release-check",
]
default-members = [
    "crates/memcore",
    "crates/portable-kernel",
    "crates/tachi-server",
    "crates/tachi-bootstrap",
    "crates/tachi-hub",
]
resolver = "2"

[profile.release]
lto = true
strip = true

# Trim debug symbols in dev to speed up cold compile of the large tachi-server
# crate (~165K LOC). `line-tables-only` keeps panic backtraces (file:line) while
# dropping full variable debuginfo, which is the bulk of the linker cost.
[profile.dev]
debug = "line-tables-only"

# clap derive needs stack-slot reuse to construct the CLI within the test
# thread's stack. Keep until cli_command_tree_builds_within_a_bounded_stack
# passes without this override.
[profile.dev.package.tachi-bootstrap]
opt-level = 1

# Keep Argon2 at opt-level 3 in both non-release profiles.
[profile.dev.package.argon2]
opt-level = 3

[profile.test.package.argon2]
opt-level = 3

[workspace.dependencies]
# Bundle SQLite for consistent cross-platform migrations. Security floor:
# SQLite >= 3.54.0 (#833). Keep the independent compile-time and runtime
# floor checks in memcore. Downstream ZeroClaw must use the same rusqlite
# major because Cargo permits only one `links = "sqlite3"` dependency.
rusqlite = { version = "0.41", features = ["backup", "bundled", "vtab", "functions", "serialize"] }
sqlite-vec = "0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# Successor lane for chrono (RUSTSEC-2026-0543, unmaintained; migration #2361).
# std+serde only: no system timezone is used anywhere in this workspace.
jiff = { version = "1", default-features = false, features = ["std", "serde"] }
regex = "1.10.0"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
# rustls crypto provider — ring instead of aws-lc-rs to avoid the large
# aws-lc-sys C/C++ compile in cold builds. reqwest uses rustls-no-provider,
# so we install ring ourselves before constructing HTTPS clients.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "tls12", "std"] }
