[workspace]
members = [
    "crates/memcore",
    "crates/memory-node",
    "crates/tachi-server",
    "crates/memory-server-capture-gate",
    "crates/memory-server-hub-cli",
    "crates/memory-server-manifest-audit",
    "crates/tachi-params",
    "crates/memory-server-prompt-envelope",
    "crates/memory-server-rescue",
    "crates/memory-server-runtime",
    # Portable kernel facade: memcore without admin (vault/hub/foundry/pack).
    # Downstream forks (HyperTachi) should sync this graph, not full tachi-server.
    "crates/portable-kernel",
    # Stripped server profile (bin): serves the portable kernel over MCP stdio
    # (save/search/get/status), no operator/product surfaces. Companion to the
    # portable-kernel library for the HyperMem runtime cutover.
    "crates/portable-server",
    "crates/tachi-bootstrap",
    "crates/tachi-dispatch",
    "crates/tachi-foundry",
    "crates/tachi-hub",
    "crates/tachi-llm",
    "crates/tachi-merge-ops",
    # Vault crypto + versioned KDF-parameter format leaf crate, extracted
    # for cross-product reuse (tachi#1080 v1: crypto+format only, store
    # stays product-local). Depends on nothing else in this workspace.
    "crates/vault-kit",
    "tools/cleaner",
]
default-members = [
    "crates/memcore",
    "crates/portable-kernel",
    "crates/tachi-server",
    "crates/tachi-bootstrap",
    "crates/tachi-hub",
]
resolver = "2"

[profile.release]
lto = true
strip = true

# Trim debug symbols in dev to speed up cold compile of the large tachi-server
# crate (~165K LOC). `line-tables-only` keeps panic backtraces (file:line) while
# dropping full variable debuginfo, which is the bulk of the linker cost.
[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
# `bundled` compiles the SQLite C amalgamation (libsqlite3-sys).
# Kept bundled intentionally (see #833 decision: CI/release targets
# x86_64-pc-windows-msvc + 4 *nix targets with no per-platform SQLite install;
# version drift would risk silent migration regressions).
#
# Bundled SQLite must be >= 3.50.3 (security floor, #833):
#   - CVE-2025-7709: corrupt FTS5 index -> memory access (fixed 3.50.3)
#   - CVE-2025-6965: aggregate term count overflow (fixed 3.50.2)
#   - CVE-2025-29087 / -3277: concat_ws() integer overflow (fixed 3.49.1)
#   - CVE-2025-29088: lookaside allocator DoS via sqlite3_db_config (fixed 3.49.1)
#
# The version range below does NOT by itself carry that floor. Bundled versions
# are plain sqlite3, no sqlcipher variant: its upper end (rusqlite 0.38 /
# libsqlite3-sys 0.36.0) bundles 3.51.1, but its lower end (rusqlite 0.37 /
# libsqlite3-sys 0.35.0) bundles 3.50.2 — one patch short, missing exactly
# CVE-2025-7709. The range is widened anyway (#1453) so that consumers pinned to
# 0.37 by other crates can build memcore; that lower bound is permitted only
# because the floor is enforced independently of the range, in two places:
#   - compile time: `const _: () = assert!(SQLITE_VERSION_NUMBER >= 3_050_003)`
#     in crates/memcore/src/lib.rs — fails the build of anyone, including a
#     downstream git-dependency consumer, who resolves below the floor.
#   - run time: `bundled_sqlite_meets_security_floor_3_50_3` in
#     crates/memcore/src/db/tests.rs — checks the library actually loaded.
# Both restate `3.50.3` on purpose; do not collapse them onto one shared
# constant, and do not relax either one to make a below-floor pin resolve.
rusqlite = { version = ">=0.37, <0.39", features = ["backup", "bundled", "vtab", "functions"] }
sqlite-vec = "0.1.7-alpha.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10.0"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
# rustls crypto provider — ring instead of aws-lc-rs to avoid the large
# aws-lc-sys C/C++ compile in cold builds. reqwest uses rustls-no-provider,
# so we install ring ourselves before constructing HTTPS clients.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
