[workspace]
members = [
    "crates/memcore",
    "crates/memory-node",
    "crates/tachi-server",
    "crates/memory-server-capture-gate",
    "crates/memory-server-hub-cli",
    "crates/memory-server-manifest-audit",
    "crates/tachi-params",
    "crates/memory-server-prompt-envelope",
    "crates/memory-server-rescue",
    "crates/memory-server-runtime",
    # Portable kernel facade: memcore without admin (vault/hub/foundry/pack).
    # Downstream forks (HyperTachi) should sync this graph, not full tachi-server.
    "crates/portable-kernel",
    "crates/tachi-bootstrap",
    "crates/tachi-dispatch",
    "crates/tachi-foundry",
    "crates/tachi-hub",
    "crates/tachi-llm",
    "crates/tachi-merge-ops",
    "tools/cleaner",
]
default-members = [
    "crates/memcore",
    "crates/portable-kernel",
    "crates/tachi-server",
    "crates/tachi-bootstrap",
    "crates/tachi-hub",
]
resolver = "2"

[profile.release]
lto = true
strip = true

# Trim debug symbols in dev to speed up cold compile of the large tachi-server
# crate (~165K LOC). `line-tables-only` keeps panic backtraces (file:line) while
# dropping full variable debuginfo, which is the bulk of the linker cost.
[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
# `bundled` compiles the SQLite C amalgamation (libsqlite3-sys).
# Kept bundled intentionally (see #833 decision: CI/release targets
# x86_64-pc-windows-msvc + 4 *nix targets with no per-platform SQLite install;
# version drift would risk silent migration regressions).
#
# Bumped 0.32 -> 0.38 (security floor) so bundled SQLite is >= 3.50.3
# (libsqlite3-sys 0.36.0 with the `bundled` feature ships plain sqlite3 3.51.1;
# no sqlcipher variant is used):
#   - CVE-2025-7709: corrupt FTS5 index -> memory access (fixed 3.50.3)
#   - CVE-2025-6965: aggregate term count overflow (fixed 3.50.2)
#   - CVE-2025-29087 / -3277: concat_ws() integer overflow (fixed 3.49.1)
#   - CVE-2025-29088: lookaside allocator DoS via sqlite3_db_config (fixed 3.49.1)
# memcore asserts sqlite_version() >= 3.50.3 at test time.
rusqlite = { version = "0.38", features = ["backup", "bundled", "vtab"] }
sqlite-vec = "0.1.7-alpha.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5"] }
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10.0"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
# rustls crypto provider — ring instead of aws-lc-rs to avoid the large
# aws-lc-sys C/C++ compile in cold builds. reqwest uses rustls-no-provider,
# so we install ring ourselves before constructing HTTPS clients.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
