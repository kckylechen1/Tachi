[workspace]
members = [
    "crates/memory-core",
    "crates/memory-node",
    "crates/memory-server",
    "crates/memory-server-params",
    "crates/memory-server-runtime",
    "crates/tachi-bootstrap",
    "crates/tachi-dispatch",
    "crates/tachi-foundry",
    "crates/tachi-hub",
    "crates/tachi-llm",
    "tools/cleaner",
]
default-members = [
    "crates/memory-core",
    "crates/memory-server",
    "crates/tachi-bootstrap",
    "crates/tachi-hub",
]
resolver = "2"

[profile.release]
lto = true
strip = true

# Trim debug symbols in dev to speed up cold compile of the large memory-server
# crate (~165K LOC). `line-tables-only` keeps panic backtraces (file:line) while
# dropping full variable debuginfo, which is the bulk of the linker cost.
[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
# `bundled` compiles the SQLite C amalgamation (libsqlite3-sys, ~5.9s wall /
# 2.1% of cold-build unit-time on arm64). Evaluated against system SQLite in
# #833 and KEPT INTENTIONALLY — switching is unsafe for this repo:
#   1. The CI/release matrix targets `x86_64-pc-windows-msvc` (no system SQLite),
#      plus 4 *nix targets, with NO per-platform SQLite install step.
#   2. Version drift: bundled pins SQLite 3.46.0; Ubuntu 24.04 ships 3.45 and
#      macOS varies. DB migrations and the FTS5/JSON1/vec0 schema are validated
#      against the bundled version — system builds can regress silently.
#   3. `load_extension` + `vtab` (needed by libsimple + sqlite-vec) require
#      build flags not guaranteed on every system SQLite.
# The ~5.9s cost is low ROI vs the 31s memory-server crate bottleneck. A
# build-time test (memory-core `sqlite_features_asserted`) locks the decision
# by asserting bundled SQLite + FTS5 + JSON1 are present. See issue #833.
rusqlite = { version = "0.32", features = ["backup", "bundled", "vtab"] }
sqlite-vec = "0.1.7-alpha.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5"] }
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10.0"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
# rustls crypto provider — ring instead of aws-lc-rs to avoid the large
# aws-lc-sys C/C++ compile in cold builds. reqwest uses rustls-no-provider,
# so we install ring ourselves before constructing HTTPS clients.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
