name: Setup Rust
description: Install the repository-pinned Rust toolchain with rustup

inputs:
  targets:
    description: Optional comma or whitespace separated rustup targets to install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: pwsh
      env:
        INPUT_TARGETS: ${{ inputs.targets }}
      run: |
        $ErrorActionPreference = "Stop"
        if ($PSVersionTable.PSVersion.Major -ge 7) {
          $PSNativeCommandUseErrorActionPreference = $true
        }

        if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
          throw "rustup is required on the runner but was not found."
        }

        $toolchainFile = Join-Path $env:GITHUB_WORKSPACE "rust-toolchain.toml"
        $toolchainMatches = @(Select-String -Path $toolchainFile -Pattern '^\s*channel\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"\s*$')
        if ($toolchainMatches.Count -ne 1) {
          throw "rust-toolchain.toml must contain exactly one exact semver channel."
        }
        $toolchain = $toolchainMatches[0].Matches[0].Groups[1].Value

        rustup toolchain install $toolchain --profile minimal --component clippy --component rustfmt --no-self-update

        if ($env:INPUT_TARGETS) {
          $targets = $env:INPUT_TARGETS -split '[,\s]+' | Where-Object { $_ }
          foreach ($target in $targets) {
            rustup target add --toolchain $toolchain $target
          }
        }

        rustup run $toolchain rustc --version
        rustup run $toolchain cargo --version
