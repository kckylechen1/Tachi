name: Setup Rust
description: Install the repository-pinned Rust toolchain with rustup

inputs:
  targets:
    description: Optional comma or whitespace separated rustup targets to install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: pwsh
      env:
        INPUT_TARGETS: ${{ inputs.targets }}
      run: |
        $ErrorActionPreference = "Stop"
        if ($PSVersionTable.PSVersion.Major -ge 7) {
          $PSNativeCommandUseErrorActionPreference = $true
        }

        if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
          throw "rustup is required on the runner but was not found."
        }

        $toolchainFile = Join-Path $env:GITHUB_WORKSPACE "rust-toolchain.toml"
        $toolchainMatches = @(Select-String -Path $toolchainFile -Pattern '^\s*channel\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"\s*$')
        if ($toolchainMatches.Count -ne 1) {
          throw "rust-toolchain.toml must contain exactly one exact semver channel."
        }
        $toolchain = $toolchainMatches[0].Matches[0].Groups[1].Value

        function Test-InstalledToolchain {
          param([string]$Name)
          $hadAutoInstall = Test-Path Env:RUSTUP_AUTO_INSTALL
          $previousAutoInstall = $env:RUSTUP_AUTO_INSTALL
          try {
            # Inspection must not implicitly download an absent toolchain.
            $env:RUSTUP_AUTO_INSTALL = "0"
            $details = @(& rustup run $Name rustc -vV)
            if ($LASTEXITCODE -ne 0) { return $false }
            $release = @($details | Select-String -Pattern '^release: (.+)$')
            $hostLine = @($details | Select-String -Pattern '^host: ([a-zA-Z0-9_-]+)$')
            if ($release.Count -ne 1 -or $hostLine.Count -ne 1 -or $release[0].Matches[0].Groups[1].Value -ne $Name) {
              return $false
            }
            $toolchainHost = $hostLine[0].Matches[0].Groups[1].Value
            $components = @(& rustup component list --toolchain $Name --installed --quiet)
            if ($LASTEXITCODE -ne 0) { return $false }
            foreach ($component in @("rustc", "cargo", "rust-std", "clippy", "rustfmt")) {
              if ($components -cnotcontains "$component-$toolchainHost") { return $false }
            }
            foreach ($binary in @("rustc", "cargo", "rustdoc", "cargo-clippy", "clippy-driver", "rustfmt")) {
              $binaryPath = (& rustup which --toolchain $Name $binary | Out-String).Trim()
              if ($LASTEXITCODE -ne 0 -or -not $binaryPath -or -not (Test-Path -LiteralPath $binaryPath -PathType Leaf)) {
                return $false
              }
            }
            return $true
          } catch {
            # A failed inspection is not readiness; retain the pinned installer.
            return $false
          } finally {
            if ($hadAutoInstall) {
              $env:RUSTUP_AUTO_INSTALL = $previousAutoInstall
            } else {
              Remove-Item Env:RUSTUP_AUTO_INSTALL -ErrorAction SilentlyContinue
            }
          }
        }

        if (-not (Test-InstalledToolchain $toolchain)) {
          rustup toolchain install $toolchain --profile minimal --component clippy --component rustfmt --no-self-update
        }

        if ($env:INPUT_TARGETS) {
          $targets = $env:INPUT_TARGETS -split '[,\s]+' | Where-Object { $_ }
          foreach ($target in $targets) {
            rustup target add --toolchain $toolchain $target
          }
        }

        $rustcPath = (& rustup which --toolchain $toolchain rustc | Out-String).Trim()
        if ($LASTEXITCODE -ne 0 -or -not $rustcPath) {
          throw "Could not locate rustc for toolchain $toolchain."
        }
        $toolchainBin = Split-Path -Parent $rustcPath

        # Pin command lookup as well as rustup: hosted macOS can put Homebrew Rust first.
        $env:RUSTUP_TOOLCHAIN = $toolchain
        $env:PATH = "$toolchainBin$([IO.Path]::PathSeparator)$env:PATH"
        Add-Content -Path $env:GITHUB_PATH -Value $toolchainBin -Encoding utf8
        Add-Content -Path $env:GITHUB_ENV -Value "RUSTUP_TOOLCHAIN=$toolchain" -Encoding utf8

        $expectedRustcVersion = (& rustup run $toolchain rustc --version | Out-String).Trim()
        if ($LASTEXITCODE -ne 0) {
          throw "Could not read rustc version for toolchain $toolchain."
        }
        $expectedCargoVersion = (& rustup run $toolchain cargo --version | Out-String).Trim()
        if ($LASTEXITCODE -ne 0) {
          throw "Could not read cargo version for toolchain $toolchain."
        }
        $actualRustcVersion = (& rustc --version | Out-String).Trim()
        if ($LASTEXITCODE -ne 0) {
          throw "Effective rustc command failed."
        }
        $actualCargoVersion = (& cargo --version | Out-String).Trim()
        if ($LASTEXITCODE -ne 0) {
          throw "Effective cargo command failed."
        }

        if ($actualRustcVersion -ne $expectedRustcVersion -or $actualRustcVersion -notmatch "^rustc $([regex]::Escape($toolchain))(?: |$)") {
          throw "Effective rustc version '$actualRustcVersion' does not match pinned toolchain '$expectedRustcVersion'."
        }
        if ($actualCargoVersion -ne $expectedCargoVersion) {
          throw "Effective cargo version '$actualCargoVersion' does not match pinned toolchain '$expectedCargoVersion'."
        }

        Write-Output $actualRustcVersion
        Write-Output $actualCargoVersion
