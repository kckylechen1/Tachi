name: Setup Rust
description: Install a Rust toolchain with rustup on the runner

inputs:
  toolchain:
    description: Rust toolchain channel or version
    required: false
    default: stable
  targets:
    description: Optional comma or whitespace separated rustup targets to install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: pwsh
      env:
        INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
        INPUT_TARGETS: ${{ inputs.targets }}
      run: |
        $ErrorActionPreference = "Stop"
        if ($PSVersionTable.PSVersion.Major -ge 7) {
          $PSNativeCommandUseErrorActionPreference = $true
        }

        if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
          throw "rustup is required on the runner but was not found."
        }

        rustup set profile minimal
        rustup toolchain install $env:INPUT_TOOLCHAIN --no-self-update
        rustup default $env:INPUT_TOOLCHAIN

        if ($env:INPUT_TARGETS) {
          $targets = $env:INPUT_TARGETS -split '[,\s]+' | Where-Object { $_ }
          foreach ($target in $targets) {
            rustup target add --toolchain $env:INPUT_TOOLCHAIN $target
          }
        }

        rustc --version
        cargo --version
