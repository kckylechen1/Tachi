name: Full CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Check release version sync
        run: python3 scripts/check_release_versions.py

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run cargo audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit --deny warnings

      - name: Install cargo-nextest
        # get.nextest.rs is unreachable from this runner's network (DNS blocked);
        # taiki-e/install-action pulls a prebuilt binary from GitHub Releases.
        uses: taiki-e/install-action@nextest

      - name: Run workspace tests
        run: cargo nextest run --workspace --locked --profile ci

      - name: Verify portable-kernel feature boundary
        run: cargo test -p portable-kernel --features portable-contract-test --locked

      - name: Run doc tests
        run: cargo test --workspace --locked --doc

  node:
    name: Node packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/tachi-cli
          - integrations/openclaw

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.package }}
        run: npm run build

      - name: Run npm audit
        working-directory: ${{ matrix.package }}
        run: npm audit --audit-level=high || true
