name: Full CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-seat-setup:
    name: Build seat setup policy
    # Trusted acceptance lane (#1865): claims the self-hosted
    # tachi-acceptance runner only. Admitted sources, fail closed:
    #   * push / workflow_dispatch whose original actor AND triggering
    #     actor are the repository owner, or
    #   * pull_request whose head repo is this repository AND whose opener,
    #     original actor, and triggering actor are all the repository
    #     owner.
    # Both actor fields are required (reviews R3/R5): on a re-run
    # github.actor keeps the original event actor while triggering_actor
    # is the current operator, so requiring both blocks a collaborator
    # re-running an owner-triggered run (R3) AND the owner re-running a
    # collaborator-pushed head on an owner-opened PR (R5).
    # Fork PRs, non-owner operators, and any event type not listed here
    # (pull_request_target, schedule, merge_group, ...) skip the job before
    # any runner claim -- this never depends on close-external-prs winning
    # a race against the scheduler. Trust root: repository write access is
    # owner-only while the repo is private (runbook visibility contract
    # governs any future visibility/collaborator change).
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner)
    runs-on: [self-hosted, tachi-acceptance]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Runner disk preflight (light lane)
        # #1865: clear-failure disk gate + prior-job residue cleanup.
        shell: bash
        run: bash .github/scripts/runner_hygiene.sh preflight 10

      - name: Validate setup and CI supply-chain policy
        run: |
          bash -n .agents/setup
          if grep -Eq '(^|[[:space:]])(curl|wget)[[:space:]]|cargo[[:space:]]+(install|fetch)|rustup[[:space:]]+(toolchain|component)[[:space:]]+(install|add)' .agents/setup; then
            echo 'build-seat setup must not bootstrap mutable tools' >&2
            exit 1
          fi
          if grep -Eq 'CARGO_NET_OFFLINE|dependency cache|advisory (database|DB)' .agents/setup; then
            echo 'build-seat setup verifies tools, not dependency or advisory data readiness' >&2
            exit 1
          fi

          policy_files=()
          while IFS= read -r file; do
            policy_files+=("${file}")
          done < <(git ls-files | grep -E '(^\.github/workflows/.+\.ya?ml$|(^|/)action\.ya?ml$)')
          if ((${#policy_files[@]} == 0)); then
            echo 'supply-chain policy found no checked-in workflow or action roots' >&2
            exit 1
          fi
          if ! printf '%s\n' "${policy_files[@]}" | grep -Eq '^\.github/workflows/.+\.ya?ml$' \
            || ! printf '%s\n' "${policy_files[@]}" | grep -Eq '(^|/)action\.ya?ml$'; then
            echo 'supply-chain policy must include every tracked workflow and action manifest' >&2
            exit 1
          fi

          ruby .github/scripts/validate_action_pins.rb --self-test --repo-root . "${policy_files[@]}"

          direct_toolchain_action_pattern='^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]+.*(rust-toolchain|setup-rust-toolchain)@'
          toolchain_input_pattern='^[[:space:]]*toolchain:[[:space:]]+'
          moving_rustup_pattern='^[[:space:]]*(run:[[:space:]]+)?(sudo[[:space:]]+)?rustup.*(^|[^[:alnum:]_.-])(stable|beta|nightly)([^[:alnum:]_.-]|$)'

          if ! printf '%s\n' '      uses: dtolnay/rust-toolchain@0123456789abcdef0123456789abcdef01234567 # v1' | grep -Eq "${direct_toolchain_action_pattern}" \
            || ! printf '%s\n' '        toolchain: stable' | grep -Eq "${toolchain_input_pattern}" \
            || ! printf '%s\n' '        toolchain: 1.97.0' | grep -Eq "${toolchain_input_pattern}" \
            || ! printf '%s\n' '      run: rustup toolchain install stable' | grep -Eq "${moving_rustup_pattern}" \
            || printf '%s\n' '      run: rustup toolchain install 1.97.0' | grep -Eq "${moving_rustup_pattern}"; then
            echo 'Rust toolchain policy self-test failed' >&2
            exit 1
          fi

          toolchain_files=()
          while IFS= read -r file; do
            toolchain_files+=("${file}")
          done < <(git ls-files 'rust-toolchain' 'rust-toolchain.toml')
          if ((${#toolchain_files[@]} != 1)) || [[ "${toolchain_files[0]}" != rust-toolchain.toml ]] \
            || ! grep -Eq '^channel = "[0-9]+\.[0-9]+\.[0-9]+"$' rust-toolchain.toml; then
            echo 'rust-toolchain.toml must be the single exact Rust toolchain source' >&2
            exit 1
          fi

          if grep -hE "${direct_toolchain_action_pattern}" "${policy_files[@]}"; then
            echo 'workflows must use the local Rust action backed by rust-toolchain.toml' >&2
            exit 1
          fi
          if grep -hE "${toolchain_input_pattern}" "${policy_files[@]}"; then
            echo 'workflow toolchain inputs must not override rust-toolchain.toml' >&2
            exit 1
          fi
          if grep -hE "${moving_rustup_pattern}" "${policy_files[@]}"; then
            echo 'rustup commands must not use moving Rust toolchain names' >&2
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*run: npm audit --audit-level=high[[:space:]]*$' .github/workflows/ci.yml; then
            echo 'npm audit must enforce high-severity findings' >&2
            exit 1
          fi
          if grep -Eq 'npm audit[^\n]*\|\|[[:space:]]*true' .github/workflows/ci.yml; then
            echo 'npm audit must enforce high-severity findings' >&2
            exit 1
          fi

          setup_test_root="$(mktemp -d)"
          trap 'rm -rf -- "${setup_test_root}"' EXIT
          setup_stub_dir="${setup_test_root}/bin"
          mkdir -p "${setup_stub_dir}"
          required_tools=(cargo rustc cargo-nextest cargo-audit python3 node npm)

          for tool in "${required_tools[@]}"; do
            printf '#!/bin/sh\nexit 0\n' >"${setup_stub_dir}/${tool}"
          done
          printf '%s\n' \
            '#!/bin/sh' \
            'case "${1:-}" in' \
            '  --version) printf "cargo %s (fake)\n" "${SIMULATE_CARGO_VERSION:-1.97.0}" ;;' \
            '  clippy|fmt)' \
            '    if [ -n "${SIMULATE_MISSING_COMPONENT:-}" ] && [ "$1" = "${SIMULATE_MISSING_COMPONENT}" ]; then exit 1; fi' \
            '    printf "%s fake\n" "$1"' \
            '    ;;' \
            '  *) exit 0 ;;' \
            'esac' >"${setup_stub_dir}/cargo"
          printf '%s\n' \
            '#!/bin/sh' \
            'printf "rustc %s (fake)\n" "${SIMULATE_RUSTC_VERSION:-1.97.0}"' >"${setup_stub_dir}/rustc"
           printf '%s\n' \
             '#!/bin/sh' \
             'printf "cargo-audit %s (fake)\n" "${SIMULATE_CARGO_AUDIT_VERSION:-0.22.2}"' >"${setup_stub_dir}/cargo-audit"
           printf '%s\n' \
             '#!/bin/sh' \
             'printf "clippy %s (fake)\n" "${SIMULATE_CLIPPY_VERSION:-0.1.97}"' >"${setup_stub_dir}/cargo-clippy"
           printf '%s\n' \
             '#!/bin/sh' \
             'printf "%s\n" "${SIMULATE_NODE_VERSION:-v20.0.0}"' >"${setup_stub_dir}/node"
           printf '%s\n' \
             '#!/bin/sh' \
             'if [ "${1:-}" != api ] || [ "${2:-}" != user ] || [ "${3:-}" != --jq ] || [ "${4:-}" != .login ]; then exit 2; fi' \
             'if [ -n "${GH_TOKEN:-}" ]; then' \
             '  printf "GH_TOKEN\n" >"${GH_STUB_USED_FILE}"' \
             '  [ "${GH_TOKEN}" = valid-gh-token ] || exit 1' \
             'elif [ -n "${GITHUB_TOKEN:-}" ]; then' \
             '  printf "GITHUB_TOKEN\n" >"${GH_STUB_USED_FILE}"' \
             '  [ "${GITHUB_TOKEN}" = valid-github-token ] || exit 1' \
             'else' \
             '  printf "NO_TOKEN\n" >"${GH_STUB_USED_FILE}"' \
             '  exit 1' \
             'fi' \
             'printf "stub-user\n"' >"${setup_stub_dir}/gh"
           chmod +x "${setup_stub_dir}"/*

           run_fake_setup() {
             local auth_case="${7:-none}"
             local -a auth_env=(env -u GITHUB_TOKEN -u GH_TOKEN)
             case "${auth_case}" in
               none) ;;
               invalid-github) auth_env+=(GITHUB_TOKEN=invalid-github-token) ;;
               invalid-gh) auth_env+=(GH_TOKEN=invalid-gh-token) ;;
               both-gh-wins) auth_env+=(GITHUB_TOKEN=invalid-github-token GH_TOKEN=valid-gh-token) ;;
               *) echo "unknown gh auth fixture: ${auth_case}" >&2; return 2 ;;
             esac
             "${auth_env[@]}" \
               SIMULATE_MISSING_COMPONENT="${1:-}" \
               SIMULATE_NODE_VERSION="${2:-v20.0.0}" \
               SIMULATE_RUSTC_VERSION="${3:-1.97.0}" \
               SIMULATE_CARGO_VERSION="${4-1.97.0}" \
               SIMULATE_CARGO_AUDIT_VERSION="${5:-0.22.2}" \
               SIMULATE_CLIPPY_VERSION="${6-0.1.97}" \
               GH_STUB_USED_FILE="${setup_test_root}/gh-used" \
               CARGO_HOME="${setup_test_root}/cargo-home" \
               PATH="${setup_stub_dir}" \
               /bin/bash .agents/setup >"${setup_test_root}/output" 2>&1
           }

          rm -f -- "${setup_test_root}/gh-used"
          run_fake_setup
          if [[ -e "${setup_test_root}/gh-used" ]]; then
            echo 'setup performed gh auth network work with no token env' >&2
            exit 1
          fi
          grep -F 'setup: skip -- gh present but no token env set' "${setup_test_root}/output"
          for tool in "${required_tools[@]}"; do
            mv "${setup_stub_dir}/${tool}" "${setup_stub_dir}/${tool}.disabled"
            if run_fake_setup; then
              echo "setup accepted missing required tool: ${tool}" >&2
              exit 1
            fi
            grep -F "${tool}" "${setup_test_root}/output"
            mv "${setup_stub_dir}/${tool}.disabled" "${setup_stub_dir}/${tool}"
          done

          for component_case in clippy:clippy rustfmt:fmt; do
            component="${component_case%%:*}"
            subcommand="${component_case##*:}"
            if run_fake_setup "${subcommand}"; then
              echo "setup accepted missing Rust component: ${component}" >&2
              exit 1
            fi
            grep -F "${component}" "${setup_test_root}/output"
          done

          if run_fake_setup "" v19.99.0; then
            echo 'setup accepted unsupported Node v19' >&2
            exit 1
          fi
          grep -F 'node>=20(found:v19.99.0)' "${setup_test_root}/output"
          if ! run_fake_setup "" v20.0.0; then
            echo 'setup rejected supported Node v20' >&2
            exit 1
          fi
          if run_fake_setup "" v20.0.0 1.96.0 1.97.0; then
            echo 'setup accepted a mismatched effective rustc' >&2
            exit 1
          fi
          grep -F 'rustc=1.96.0(required:1.97.0)' "${setup_test_root}/output"
          if run_fake_setup "" v20.0.0 1.97.0 1.96.0; then
            echo 'setup accepted a mismatched effective cargo' >&2
            exit 1
          fi
          grep -F 'cargo=1.96.0(required:1.97.0)' "${setup_test_root}/output"
           if run_fake_setup "" v20.0.0 1.97.0 1.97.0 0.22.1; then
             echo 'setup accepted a mismatched cargo-audit' >&2
             exit 1
           fi
           grep -F 'cargo-audit=0.22.1(required:0.22.2)' "${setup_test_root}/output"

           # A4: exact cargo/rustc with wrong cargo-clippy must reject even when
           # SIMULATE_CARGO_VERSION is inherited by the hermetic fixture.
           if run_fake_setup "" v20.0.0 1.97.0 1.97.0 0.22.2 0.1.96; then
             echo 'setup accepted a mismatched effective clippy' >&2
             exit 1
           fi
           grep -F 'cargo-clippy --version resolved to: 0.1.96' "${setup_test_root}/output"
           grep -F 'required (derived from channel 1.97.0): 0.1.97' "${setup_test_root}/output"

           # A5: gh auth is optional without token env, but token-env poisoning
           # fails closed; GH_TOKEN is the effective value when both are set.
           if run_fake_setup "" v20.0.0 1.97.0 1.97.0 0.22.2 0.1.97 invalid-github; then
             echo 'setup accepted an invalid GITHUB_TOKEN' >&2
             exit 1
           fi
           grep -F 'effective gh auth env invalid (set: GITHUB_TOKEN)' "${setup_test_root}/output"
           if grep -F 'invalid-github-token' "${setup_test_root}/output" >/dev/null; then
             echo 'setup exposed GITHUB_TOKEN fixture material' >&2
             exit 1
           fi
           if run_fake_setup "" v20.0.0 1.97.0 1.97.0 0.22.2 0.1.97 invalid-gh; then
             echo 'setup accepted an invalid GH_TOKEN' >&2
             exit 1
           fi
           grep -F 'effective gh auth env invalid (set: GH_TOKEN)' "${setup_test_root}/output"
           if grep -F 'invalid-gh-token' "${setup_test_root}/output" >/dev/null; then
             echo 'setup exposed GH_TOKEN fixture material' >&2
             exit 1
           fi
           if ! run_fake_setup "" v20.0.0 1.97.0 1.97.0 0.22.2 0.1.97 both-gh-wins; then
             echo 'setup rejected GH_TOKEN precedence fixture' >&2
             exit 1
           fi
           grep -F 'GH_TOKEN' "${setup_test_root}/gh-used"
           if grep -F 'GITHUB_TOKEN' "${setup_test_root}/gh-used" >/dev/null; then
             echo 'gh stub did not use GH_TOKEN precedence' >&2
             exit 1
           fi
          python3 .github/scripts/runner_scan_diagnostics_test.py
          python3 -m unittest discover -s .github/scripts -p "test_ci_acceptance.py" -v

      - name: Runner workspace cleanup
        # #1865: no checkout residue survives a failed or cancelled job.
        if: always()
        shell: bash
        run: bash .github/scripts/runner_hygiene.sh cleanup

  rust:
    name: Rust workspace
    # Trusted acceptance lane (#1865): fork guard identical to
    # build-seat-setup -- see there for the rationale.
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner)
    runs-on: [self-hosted, tachi-acceptance]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Runner disk preflight (heavy lane)
        # #1865 frozen watermark: heavy Rust work refuses below 60 GiB free,
        # loudly, before any toolchain or build work starts.
        shell: bash
        run: bash .github/scripts/runner_hygiene.sh preflight 60

      - name: Setup Rust
        id: rust_setup
        uses: ./.github/actions/setup-rust

      - name: Record executed candidate identity
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          printf 'requested_head=%s\nbase=%s\n' "$PR_HEAD_SHA" "$PR_BASE_SHA"
          printf 'checkout_sha=%s\ncheckout_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"

      - name: Check release version sync
        id: release_versions
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        run: python3 scripts/check_release_versions.py

      - name: Test nextest census contracts
        id: nextest_contracts
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        run: python3 -m unittest scripts.test_nextest_census scripts.test_nextest_known_reds scripts.test_nextest_slow_diff

      - name: Test Rust setup source contracts
        id: setup_contracts
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        run: python3 -m unittest discover -s .github/actions/setup-rust -v

      - name: Run clippy
        id: clippy
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check formatting
        id: fmt
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        run: cargo fmt --all --check

      - name: Install cargo-audit
        id: audit_install
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        run: cargo install cargo-audit --version 0.22.2 --locked --quiet

      - name: Run cargo audit
        id: audit
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' && steps.audit_install.outcome == 'success' }}
        run: cargo audit --deny warnings

      - name: Install cargo-nextest
        id: nextest_install
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        # get.nextest.rs is unreachable from this runner's network (DNS blocked);
        # taiki-e/install-action pulls a prebuilt binary from GitHub Releases.
        uses: taiki-e/install-action@c295c25a8d3df7288fa86db860a4f8062bf76ad8 # releases/nextest snapshot 2026-07-25

      - name: Run workspace tests
        id: workspace_tests
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' && steps.nextest_install.outcome == 'success' }}
        run: cargo nextest run --workspace --locked --profile ci

      - name: Archive nextest JUnit timing report
        # (Refs #1095) The ci profile (.config/nextest.toml) writes
        # target/nextest/ci/junit.xml. Each <testcase> there carries a pure
        # test-BODY `time` (nextest excludes compile/link), so this artifact is
        # the archival form of nextest's own per-test timing: compile/link cost =
        # (this step's wall-time) - (sum of JUnit testcase times). That makes
        # compile/link and test-execution durations distinguishable in CI
        # telemetry instead of being collapsed into one step clock. Uses the
        # same actions/* first-party family as checkout/setup-node (pinned to
        # the v4.6.2 commit, matching the upload-artifact major already used by
        # release-cli-binaries.yml) -- no new third-party action introduced.
        # A successful run must publish its report. A failed compile may have
        # no report: preserve that primary failure, without inventing a second
        # test failure. Failed runs with a report still upload their diagnostics.
        if: >-
          ${{ !cancelled() && (steps.workspace_tests.outcome == 'success' ||
              (steps.workspace_tests.outcome == 'failure' && hashFiles('target/nextest/ci/junit.xml') != '')) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-junit-report
          path: target/nextest/ci/junit.xml
          # In particular, success without a JUnit report remains a failure.
          if-no-files-found: error

      - name: Verify portable-kernel feature boundary
        id: portable
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        run: cargo test -p portable-kernel --features portable-contract-test --locked

      - name: Run doc tests
        id: doctests
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        run: cargo test --workspace --locked --doc

      - name: Runner workspace cleanup
        # #1865: per-job-ephemeral target storage. Runs after the JUnit
        # artifact upload above so the report survives; if: always() so a
        # failed or cancelled build still frees the workspace.
        if: always()
        shell: bash
        run: bash .github/scripts/runner_hygiene.sh cleanup

  physical-db-identity-windows:
    name: Physical DB identity fallback (Windows, ${{ matrix.crate }})
    # Platform applicability -- owner adjudication 2026-09-23 (current
    # delivery only, after confirming no current Windows usage): this matrix
    # stays visible and unconditional. All three crate legs keep executing
    # on windows-latest and the aggregate still collects their raw status,
    # but the job is classified OBSERVATIONAL in
    # .github/acceptance-plan.json, so a red leg does not block this
    # delivery's CI acceptance -- the failure is reported as excluded, never
    # hidden, faked, or skipped. Not retroactive; Windows releases stay
    # prohibited until #1963 is fixed.
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        crate: [tachi-server, memcore, tachi-clean]

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # #1963 probe: libsimple 0.9's build.rs shells out to `patch`, `cmake`
      # (Unix Makefiles) and `make`, honouring the PATCH / CMAKE / MAKE env
      # vars. On windows-latest the first `patch` on PATH is Strawberry Perl's
      # GNU patch 2.5.9, which asserts on libsimple's patches. Point PATCH at
      # Git for Windows' patch and print the toolchain the build script sees.
      - name: Point libsimple build.rs at Git's GNU patch (#1963)
        shell: pwsh
        run: |
          $gitPatch = 'C:\Program Files\Git\usr\bin\patch.exe'
          if (Test-Path $gitPatch) {
            "PATCH=$gitPatch" >> $env:GITHUB_ENV
            & $gitPatch --version | Select-Object -First 1
          } else {
            Write-Output "::warning::$gitPatch not found; libsimple falls back to the first patch on PATH"
          }
          foreach ($tool in 'patch', 'cmake', 'make', 'gmake', 'mingw32-make') {
            $found = Get-Command $tool -All -ErrorAction SilentlyContinue | ForEach-Object Source
            Write-Output ("{0}: {1}" -f $tool, (($found -join '; '), '<none>' | Where-Object { $_ } | Select-Object -First 1))
          }
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            $gnuMake = Get-Command gmake, mingw32-make -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($gnuMake) { "MAKE=$($gnuMake.Source)" >> $env:GITHUB_ENV; Write-Output "MAKE=$($gnuMake.Source)" }
          }

      - name: Exercise canonical-only inventory fallback
        if: matrix.crate == 'tachi-server'
        run: >-
          cargo test -p tachi-server --locked --lib
          physical_db_identity::tests::canonical_fallback_inventory_never_mints_mutation_authority
          -- --exact

      - name: Verify stable Windows kernel identity refusal
        if: matrix.crate == 'memcore'
        run: cargo test -p memcore --locked --lib windows_canonical_identity_cannot_verify_an_opened_handle

      - name: Verify stable Windows cleaner identity refusal
        if: matrix.crate == 'tachi-clean'
        run: cargo test -p tachi-clean --locked --lib windows_directory_identity_cannot_authorize_registration

      - name: Verify stable Windows server identity refusals
        if: matrix.crate == 'tachi-server'
        run: |
          cargo test -p tachi-server --locked --lib retained_file_identity_refuses_unproven_windows_object
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p tachi-server --locked --lib windows_directory_metadata_cannot_authorize_object_identity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p tachi-server --locked --lib windows_dispatch_refuses_active_lease_without_object_identity

      - name: Verify unsupported server operations refuse without mutation
        if: matrix.crate == 'tachi-server'
        run: cargo test -p tachi-server --locked --lib platform_refusal_

      - name: Verify unproven fixture owners are retained
        if: matrix.crate == 'memcore'
        run: cargo test -p memcore --locked --lib platform_refusal_

  node:
    name: Node packages
    # Trusted acceptance lane (#1865): fork guard identical to
    # build-seat-setup -- see there for the rationale.
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner)
    runs-on: [self-hosted, tachi-acceptance]
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/tachi-cli
          - integrations/openclaw

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Runner disk preflight (light lane)
        # #1865: clear-failure disk gate + prior-job residue cleanup.
        shell: bash
        run: bash .github/scripts/runner_hygiene.sh preflight 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.package }}
        run: npm run build

      - name: Run CLI tests
        if: matrix.package == 'packages/tachi-cli'
        working-directory: packages/tachi-cli
        run: npm test

      - name: Run OpenClaw runtime compatibility smoke
        if: matrix.package == 'integrations/openclaw'
        working-directory: integrations/openclaw
        run: npm run test:runtime

      - name: Run npm audit
        working-directory: ${{ matrix.package }}
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm audit --audit-level=high

      - name: Runner workspace cleanup
        # #1865: no checkout residue survives a failed or cancelled job.
        if: always()
        shell: bash
        run: bash .github/scripts/runner_hygiene.sh cleanup

  gitleaks:
    name: Secret scan (gitleaks)
    permissions:
      contents: read
      pull-requests: read
    # Trusted acceptance lane (#1865): fork guard identical to
    # build-seat-setup -- see there for the rationale.
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner)
    runs-on: [self-hosted, tachi-acceptance]
    timeout-minutes: 10

    steps:
      - name: Runner disk gate (pre-checkout, light lane)
        # The fetch-depth: 0 checkout below is the expensive disk operation,
        # so gate before it (review R3). The canonical gate lives in
        # .github/scripts/runner_hygiene.sh, which is only available after
        # checkout; this inline copy must stay in sync with it.
        shell: bash
        run: |
          df -k . | awk -v w=10 'NR==2 {if ($4 < w*1024*1024) { printf "::error::free disk below %d GiB watermark before full-history checkout\n", w; exit 3 }}'

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Runner disk preflight (light lane)
        # #1865: clear-failure disk gate + prior-job stray/residue cleanup.
        shell: bash
        run: bash .github/scripts/runner_hygiene.sh preflight 10

      - name: Run gitleaks
        # This CI-side gate is #1578's structural fix: it is a plain, always-
        # defined GitHub Actions job so `gitleaks` is a real CI gate the
        # AGENTS.md/dispatch-lifecycle report contract can point to, not just
        # prose. Repository Actions is disabled repo-wide (#1562, owner
        # ruling: stay manual) so this job does not currently execute; the
        # live, executing secret-scan enforcement remains the local
        # `.git/hooks/pre-push` gitleaks hook on the machines that have it
        # installed. Personal-account repos need no GITLEAKS_LICENSE (only
        # GitHub Organization accounts do); this repo is under the
        # kckylechen1 personal account, not an org.
        # Licensing note (2026-08-05): gitleaks-action v2+ is NOT MIT — its
        # action.yml carries the GITLEAKS-ACTION EULA. Free for personal-account
        # repos (this one); an org would need GITLEAKS_LICENSE. The gitleaks CLI
        # the local pre-push hook runs directly remains MIT. Re-read the EULA
        # before this job runs in any org context.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Runner workspace cleanup
        # #1865: the cleanup wipes the whole workspace (including the
        # multi-GB full-history .git) so nothing squats between jobs; the
        # next checkout rebuilds it from scratch.
        if: always()
        shell: bash
        run: bash .github/scripts/runner_hygiene.sh cleanup


  acceptance:
    name: acceptance
    needs: [build-seat-setup, rust, node, gitleaks, physical-db-identity-windows]
    # Aggregate CI only; review/canary/owner approval remain separate gates.
    # This job must inspect failed/skipped dependencies, without admitting
    # forks. Required jobs fail closed on any non-success. Observational jobs
    # (owner adjudication 2026-09-23, current delivery only:
    # physical-db-identity-windows) are reported with their raw status but
    # do not block -- see .github/acceptance-plan.json and
    # docs/engineering/operations/actions-capacity.md.
    if: >-
      always() && (
        ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner) ||
        (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner)
      )
    runs-on: [self-hosted, tachi-acceptance]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Runner disk preflight (light lane)
        shell: bash
        run: bash .github/scripts/runner_hygiene.sh preflight 10

      - name: Evaluate required CI evidence and report observational exclusions
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_acceptance.py

      - name: Runner workspace cleanup
        if: always()
        shell: bash
        run: bash .github/scripts/runner_hygiene.sh cleanup
