name: Full CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-seat-setup:
    name: Build seat setup policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Validate hermetic build-seat readiness check
        run: |
          bash -n .agents/setup
          grep -Fx 'readonly REQUIRED_TOOLS=(cargo rustc cargo-nextest cargo-audit python3)' .agents/setup
          grep -Fx 'readonly REQUIRED_RUST_COMPONENTS=(clippy rustfmt)' .agents/setup
          grep -Fx '        run: npm audit --audit-level=high' .github/workflows/ci.yml
          if grep -Eq '(^|[[:space:]])(curl|wget)[[:space:]]|cargo[[:space:]]+(install|fetch)|rustup[[:space:]]+(toolchain|component)[[:space:]]+(install|add)' .agents/setup; then
            echo 'build-seat setup must not bootstrap mutable tools' >&2
            exit 1
          fi
          if grep -Eq 'npm audit[^\n]*\|\|[[:space:]]*true' .github/workflows/ci.yml; then
            echo 'npm audit must enforce high-severity findings' >&2
            exit 1
          fi

  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Check release version sync
        run: python3 scripts/check_release_versions.py

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run cargo audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit --deny warnings

      - name: Install cargo-nextest
        # get.nextest.rs is unreachable from this runner's network (DNS blocked);
        # taiki-e/install-action pulls a prebuilt binary from GitHub Releases.
        uses: taiki-e/install-action@nextest

      - name: Run workspace tests
        run: cargo nextest run --workspace --locked --profile ci

      - name: Archive nextest JUnit timing report
        # (Refs #1095) The ci profile (.config/nextest.toml) writes
        # target/nextest/ci/junit.xml. Each <testcase> there carries a pure
        # test-BODY `time` (nextest excludes compile/link), so this artifact is
        # the archival form of nextest's own per-test timing: compile/link cost =
        # (this step's wall-time) - (sum of JUnit testcase times). That makes
        # compile/link and test-execution durations distinguishable in CI
        # telemetry instead of being collapsed into one step clock. Uses the
        # same actions/* first-party family as checkout/setup-node (pinned to
        # @v4, matching the upload-artifact major already used by
        # release-cli-binaries.yml) -- no new third-party action introduced.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-report
          path: target/nextest/ci/junit.xml
          # A missing report means the junit config is dead, not that there was
          # nothing to archive -- fail loudly instead of degrading silently.
          if-no-files-found: error

      - name: Verify portable-kernel feature boundary
        run: cargo test -p portable-kernel --features portable-contract-test --locked

      - name: Run doc tests
        run: cargo test --workspace --locked --doc

  node:
    name: Node packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/tachi-cli
          - integrations/openclaw

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.package }}
        run: npm run build

      - name: Run npm audit
        working-directory: ${{ matrix.package }}
        run: npm audit --audit-level=high
