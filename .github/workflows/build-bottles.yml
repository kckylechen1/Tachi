name: Build & Publish Homebrew Bottles

on:
  # Keep this manual while GitHub Actions minutes are constrained.
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without leading v)"
        required: false

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          python3 scripts/check_release_versions.py

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          tachi_server_version=$(python3 -c 'from pathlib import Path; import re; text = Path("crates/tachi-server/Cargo.toml").read_text(); match = re.search(r"^version\s*=\s*\"([^\"]+)\"", text, re.MULTILINE); print(match.group(1) if match else "")')

          if [ -z "$tachi_server_version" ]; then
            echo "Could not find tachi-server version in Cargo.toml."
            exit 1
          fi

          if [ -z "$version" ]; then
            version="$tachi_server_version"
          fi

          if [ "$version" != "$tachi_server_version" ]; then
            echo "Tag/workflow version ($version) does not match crates/tachi-server/Cargo.toml ($tachi_server_version)."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-bottle:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: arm64_sonoma
          - runner: macos-15
            platform: sonoma

    runs-on: ${{ matrix.runner }}
    name: Bottle - ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Check out tap repo
        uses: actions/checkout@v5
        with:
          repository: kckylechen1/homebrew-tachi
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Sync formula before bottle build
        run: |
          python3 scripts/update_homebrew_formula.py \
            tap/Formula/tachi.rb \
            --version "${{ needs.resolve-version.outputs.version }}"

      - name: Register local tap
        run: brew tap kckylechen1/tachi "$PWD/tap"

      - name: Build bottle
        run: brew install --build-bottle kckylechen1/tachi/tachi

      - name: Codesign built binary (#937)
        run: |
          set -euo pipefail
          BOTTLE_BIN="$(brew --prefix tachi)/bin/tachi"
          echo ">> codesign --force -s - $BOTTLE_BIN"
          codesign --force -s - "$BOTTLE_BIN"

      - name: Create bottle
        run: |
          brew bottle --json --no-rebuild tachi
          ls -la tachi--*.tar.gz tachi--*.json

      - name: Verify codesign (#937)
        run: |
          set -euo pipefail
          for bottle in tachi--*.tar.gz; do
            [ -f "$bottle" ] || continue
            TMP_DIR="$(mktemp -d)"
            tar -xzf "$bottle" -C "$TMP_DIR"
            BIN="$(find "$TMP_DIR" -type f -name tachi -perm -u+x | head -n1)"
            if [ -z "$BIN" ]; then
              echo "error: could not locate tachi binary inside $bottle" >&2
              exit 1
            fi
            echo "== codesign -dv ($bottle) =="
            codesign -dv "$BIN" 2>&1 | tee /tmp/codesign-out.txt
            if grep -q "linker-signed" /tmp/codesign-out.txt; then
              echo "error: $BIN (from $bottle) is still linker-signed" >&2
              exit 1
            fi
            echo "== codesign --verify ($bottle) =="
            codesign --verify --strict "$BIN"
          done

      - name: Upload bottle artifact
        uses: actions/upload-artifact@v7
        with:
          name: bottle-${{ matrix.platform }}
          path: |
            tachi--*.tar.gz
            tachi--*.json

  publish-bottles:
    needs: [resolve-version, build-bottle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      TAP_REPO: kckylechen1/homebrew-tachi

    steps:
      - uses: actions/checkout@v5

      - name: Download all bottle artifacts
        uses: actions/download-artifact@v8
        with:
          path: bottles

      - name: Merge bottle manifests
        run: |
          jq -s '.' bottles/*/tachi--*.json > bottle-manifest.json
          echo "=== Merged bottle manifest ==="
          cat bottle-manifest.json

      - name: Upload bottles to GitHub Release (tap repo)
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          TAG="tachi-${VERSION}"
          gh release view "$TAG" --repo "$TAP_REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$TAP_REPO" --title "$TAG" --notes ""
          gh release upload "$TAG" bottles/*/tachi--*.tar.gz --repo "$TAP_REPO" --clobber

      - name: Check out tap repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap

      - name: Update formula with bottle block
        run: |
          python3 scripts/update_homebrew_formula.py \
            tap/Formula/tachi.rb \
            --version "${{ needs.resolve-version.outputs.version }}" \
            --bottle-manifest bottle-manifest.json \
            --bottle-root-url "https://github.com/${{ env.TAP_REPO }}/releases/download/tachi-${{ needs.resolve-version.outputs.version }}"

      - name: Commit and push formula update
        working-directory: tap
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          if git diff --quiet -- Formula/tachi.rb; then
            echo "Formula already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tachi.rb
          git commit -m "bump tachi to v${VERSION} with bottles"
          git push
