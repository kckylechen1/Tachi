name: Linux platform conformance (C2)

# Real Linux workspace and platform coverage on an ephemeral standard hosted VM.
# This lane has no dependency on the owner's shared host, installed Cargo gate,
# or host-build runtime. Owner/event admission, scope and evidence bindings remain.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: conformance-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Linux change applicability
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.scope.outputs.profile }}
      checkout_tree: ${{ steps.scope.outputs.checkout_tree }}
      run_rust: ${{ steps.scope.outputs.run_rust }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 2
      - name: Classify change applicability
        id: scope
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
        run: |
          python3 scripts/candidate_identity.py --requested-head "$PR_HEAD_SHA" --base "$PR_BASE_SHA" --fetch-missing
          python3 .github/scripts/ci_scope.py --github-output

  rust-gate:
    name: Rust workspace (Linux)
    # Fork guard identical to ci.yml build-seat-setup -- see there for the
    # rationale (both actor fields; enumerated sources only; skip before any
    # runner claim).
    needs: change-scope
    if: >-
      needs.change-scope.outputs.run_rust == 'true' && (
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      platform_receipt: ${{ steps.platform_evidence.outputs.receipt }}
    env:
      # Builds and reports belong to this disposable job workspace.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      NEXTEST_TEST_THREADS: "4"
      RUST_TEST_THREADS: "4"

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 2

      - name: Verify runner platform
        # Label-drift guard: this lane only proves anything on real Linux
        # (aarch64 or x86_64 -- the two arches with a certified seccomp
        # audit-arch). A mislabeled host must fail loudly, never fake green.
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-<unset>} uname_s=$(uname -s) uname_m=$(uname -m)"
          [ "$(uname -s)" = "Linux" ] || { echo "::error::C2 lane must run on Linux (uname -s: $(uname -s))" >&2; exit 4; }
          case "$(uname -m)" in
            aarch64|x86_64) ;;
            *) echo "::error::C2 lane must run on aarch64 or x86_64 (uname -m: $(uname -m))" >&2; exit 4 ;;
          esac

      - name: Installer prerequisites (jq, curl, tar)
        id: installer_prereqs
        # The pinned taiki-e/install-action falls back to a package-manager
        # install (apt-get, via sudo when present) whenever jq, curl or tar is
        # missing from PATH. A missing image prerequisite fails here before
        # the installer; jobs do not provision system packages. The check
        # uses the same PATH lookup (`type -P`) as the installer.
        run: |
          set -euo pipefail
          missing=""
          for tool in jq curl tar; do
            if tool_path="$(type -P "$tool")"; then
              echo "$tool: $tool_path"
            else
              missing="$missing $tool"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::C2 runner is missing installer prerequisites:${missing}. The hosted runner image must provide these tools; this job never installs system packages." >&2
            exit 5
          fi

      - name: Setup Rust
        id: rust_setup
        uses: ./.github/actions/setup-rust

      - name: Record executed candidate identity
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          printf 'requested_head=%s\nbase=%s\n' "$PR_HEAD_SHA" "$PR_BASE_SHA"
          printf 'checkout_sha=%s\ncheckout_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
          python3 scripts/candidate_identity.py --requested-head "$PR_HEAD_SHA" --base "$PR_BASE_SHA" --fetch-missing

      - name: Check release version sync
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        run: python3 scripts/check_release_versions.py

      - name: Test nextest census contracts
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        run: python3 -m unittest scripts.test_nextest_census scripts.test_nextest_known_reds scripts.test_nextest_slow_diff scripts.test_legacy_build scripts.test_register_mcps_to_hub

      - name: Test Rust setup source contracts
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        run: python3 -m unittest discover -s .github/actions/setup-rust -v

      - name: Run clippy
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check formatting
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        run: cargo fmt --all --check

      - name: Install cargo-nextest
        id: nextest_install
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' && steps.installer_prereqs.outcome == 'success' }}
        # Same taiki-e pinned snapshot and audited inputs as ci.yml
        # (get.nextest.rs may be DNS-blocked; taiki-e pulls a prebuilt binary
        # from GitHub Releases). `fallback: none` forbids a source build.
        uses: taiki-e/install-action@c295c25a8d3df7288fa86db860a4f8062bf76ad8 # releases/nextest snapshot 2026-07-25
        with:
          tool: nextest@0.9.140
          checksum: true
          fallback: none

      - name: Verify resolved cargo-nextest is the audited install
        id: nextest_verify
        # Binds execution to the checksum-verified file. All asserts fail
        # closed with exit 6:
        # (1) no Cargo alias for nextest: no CARGO_ALIAS_* variable at all,
        #     and no alias.nextest (or unfollowed `include`) in any
        #     .cargo/config[.toml] from the workspace up to /, nor in
        #     $CARGO_HOME. Aliases outrank external subcommands. `cargo config
        #     get` is nightly-only on 1.97, so the files are parsed directly.
        # (2) no cargo-nextest in ${CARGO_HOME:-~/.cargo}/bin. The Cargo book
        #     (reference/external-tools.html#custom-subcommands): "Cargo
        #     defaults to prioritizing external tools in $CARGO_HOME/bin
        #     over $PATH. Users can override this precedence by adding
        #     $CARGO_HOME/bin to $PATH."
        # (3) the cargo-nextest that PATH resolves is, after realpath, the
        #     file the pinned installer extracted: ~/.install-action/bin
        #     (taiki-e/install-action main.sh at the pinned SHA, lines 641 and
        #     658-663: used whenever the resolved cargo is not under
        #     $CARGO_HOME/bin, as after Setup Rust; the C2 logs show
        #     "adding '/home/gha/.install-action/bin' to PATH").
        # (4) that exact file, run by absolute path, reports the audited
        #     version (keep in sync with `tool:` above).
        # It then exports AUDITED_NEXTEST (the realpath) through GITHUB_ENV.
        # Every later nextest step runs "$AUDITED_NEXTEST" nextest ... by
        # absolute path, so PATH, CARGO_HOME and aliases no longer choose the
        # executable.
        if: ${{ !cancelled() && steps.nextest_install.outcome == 'success' }}
        run: |
          set -euo pipefail
          prebuilt_dir="$HOME/.install-action/bin"
          prebuilt="${prebuilt_dir}/cargo-nextest"
          home_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          # (1) No Cargo alias for nextest, from the environment or any config file
          # Cargo reads from this directory.
          alias_vars="$(env | grep -oE '^CARGO_ALIAS_[A-Za-z0-9_]*' || true)"
          if [ -n "${alias_vars}" ]; then
            echo "::error::Cargo alias environment variables are set: $(echo ${alias_vars}). Remove them from the runner service environment." >&2
            exit 6
          fi
          python3 - <<'PY' || exit 6
          import os, sys, tomllib
          from pathlib import Path
          home = Path(os.environ.get("CARGO_HOME") or Path.home() / ".cargo")
          here = Path.cwd().resolve()
          dirs = [p / ".cargo" for p in (here, *here.parents)] + [home]
          seen, bad = set(), []
          for d in dirs:
              for name in ("config.toml", "config"):
                  f = d / name
                  try:
                      if not f.is_file():
                          continue
                      real = f.resolve()
                      if real in seen:
                          continue
                      seen.add(real)
                      data = tomllib.loads(f.read_text())
                  except (OSError, ValueError) as e:
                      bad.append(f"{f}: unreadable ({type(e).__name__})")
                      continue
                  print(f"checked {f}")
                  if "include" in data:
                      bad.append(f"{f}: uses include (not followed)")
                  alias = data.get("alias")
                  if isinstance(alias, dict) and "nextest" in alias:
                      bad.append(f"{f}: defines alias.nextest")
          for b in bad:
              print(f"::error::{b}", file=sys.stderr)
          sys.exit(1 if bad else 0)
          PY
          # (2) Nothing in Cargo's own bin directory that could win the lookup.
          if [ -e "${home_bin}/cargo-nextest" ]; then
            echo "::error::${home_bin}/cargo-nextest exists; Cargo may run it for cargo nextest ahead of PATH. Remove it from the runner host (docs/engineering/operations/conformance-runner.md)." >&2
            exit 6
          fi
          # (3) PATH resolves to the extracted, checksum-verified file.
          resolved="$(type -P cargo-nextest || true)"
          resolved_real="$(realpath -e "${resolved:-/nonexistent}" 2>/dev/null || true)"
          bound="$(realpath -e "${prebuilt}" 2>/dev/null || true)"
          echo "cargo-nextest on PATH: ${resolved_real:-none}; extracted file: ${bound:-missing}"
          if [ -z "${resolved_real}" ] || [ -z "${bound}" ] || [ "${resolved_real}" != "${bound}" ]; then
            echo "::error::cargo-nextest resolves to '${resolved_real:-none}', not the checksum-verified binary '${bound:-missing}'." >&2
            exit 6
          fi
          # (4) That exact file reports the audited version.
          version_out="$("${bound}" nextest --version)"
          read -r first_line <<<"${version_out}"
          echo "bound nextest --version: ${first_line}"
          case "${first_line}" in
            "cargo-nextest 0.9.140"|"cargo-nextest 0.9.140 "*) ;;
            *)
              echo "::error::${bound} reports '${first_line}', not the audited cargo-nextest 0.9.140." >&2
              exit 6
              ;;
          esac
          # Bind: every later nextest step runs this absolute path.
          echo "AUDITED_NEXTEST=${bound}" >> "$GITHUB_ENV"

      - name: Run workspace tests
        id: workspace_tests
        # The canonical acceptance surface on real Linux: every cfg(linux)
        # test leg that the darwin-arm64 C1 lane compiles out runs here,
        # including the renameat2 paths from the #1877 inventory.
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' && steps.nextest_verify.outcome == 'success' }}
        run: |
          # A successful command without a new report must never reuse stale evidence.
          python3 -c "from pathlib import Path; Path('target/nextest/ci/junit.xml').unlink(missing_ok=True)"
          "${AUDITED_NEXTEST:?}" nextest run --workspace --locked --profile ci

      - name: Verify Linux platform coverage from workspace JUnit
        id: platform_evidence
        if: ${{ !cancelled() && steps.workspace_tests.outcome == 'success' }}
        run: python3 .github/scripts/ci_linux_platform.py produce

      - name: Archive nextest JUnit timing report
        # Retry transport in this job; never rerun tests or suppress final
        # upload failure. Each upload uses a fresh name to avoid ambiguous
        # CreateArtifact/FinalizeArtifact responses colliding on retry.
        if: >-
          ${{ !cancelled() && (steps.workspace_tests.outcome == 'success' ||
              (steps.workspace_tests.outcome == 'failure' && hashFiles('target/nextest/ci/junit.xml') != '')) }}
        uses: ./.github/actions/upload-junit
        with:
          name: nextest-junit-report-linux-c2
          path: target/nextest/ci/junit.xml

      - name: Verify portable-kernel feature boundary
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        run: |
          cargo test -p portable-kernel --features portable-contract-test --locked

      - name: Run doc tests
        if: ${{ !cancelled() && steps.rust_setup.outcome == 'success' }}
        run: |
          cargo test --workspace --locked --doc

  linux-platform:
    name: Linux-only platform conformance
    # Fork guard identical to rust-gate above (and to ci.yml build-seat-setup).
    needs: [change-scope, rust-gate]
    if: >-
      needs.change-scope.outputs.run_rust == 'true' && (
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Verify same-run Linux platform receipt
        env:
          PLATFORM_RECEIPT: ${{ needs.rust-gate.outputs.platform_receipt }}
          WORKSPACE_RESULT: ${{ needs.rust-gate.result }}
        run: python3 .github/scripts/ci_linux_platform.py verify

  linux-acceptance:
    name: Linux acceptance
    needs: [change-scope, rust-gate, linux-platform]
    if: >-
      always() && (
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 2
      - name: Evaluate Linux evidence
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
        run: |
          python3 scripts/candidate_identity.py --requested-head "$PR_HEAD_SHA" --base "$PR_BASE_SHA" --fetch-missing
          python3 .github/scripts/ci_linux_acceptance.py
