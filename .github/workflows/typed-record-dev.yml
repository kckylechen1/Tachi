name: Typed record development artifacts

on:
  push:
    branches: [codex/2105-host-typed-records]

permissions:
  contents: read

jobs:
  generate:
    if: >-
      github.repository == 'kckylechen1/Tachi' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 4
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Format candidate
        run: cargo fmt --all
      - name: Resolve new dependency and compile kernel
        run: cargo check -p memcore --no-default-features --lib --locked
      - name: Test typed records and migration policy
        run: cargo test -p memcore --lib --locked
      - name: Test isolated portable contract
        run: cargo test -p portable-kernel --features portable-contract-test --locked
      - name: Test portable MCP host
        run: cargo test -p portable-server --locked
      - name: Capture reviewable generated changes
        if: always()
        run: |
          mkdir -p typed-record-dev-artifacts
          git rev-parse HEAD > typed-record-dev-artifacts/candidate-sha.txt
          rustc -vV > typed-record-dev-artifacts/rustc.txt
          cargo -V > typed-record-dev-artifacts/cargo.txt
          cp Cargo.lock typed-record-dev-artifacts/Cargo.lock
          git diff --binary > typed-record-dev-artifacts/generated.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: typed-record-dev-${{ github.sha }}
          path: typed-record-dev-artifacts/
          retention-days: 3

  local-toolchain:
    # One explicit development commit supplies official pinned tools and public
    # dependency sources to an otherwise offline local validation workspace.
    # No downstream source, credentials or private repository data enter it.
    if: >-
      github.repository == 'kckylechen1/Tachi' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      contains(github.event.head_commit.message, '[local-toolchain]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Install the downstream pinned compiler
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt --no-self-update
      - name: Fetch the public locked dependency graph
        run: cargo fetch --locked
      - name: Cache adjacent public dependency versions for offline consumers
        run: |
          python3 - <<'PY_CACHE'
          import concurrent.futures, hashlib, json, os, pathlib, re, time, tomllib, urllib.request
          cargo_home = pathlib.Path(os.environ.get("CARGO_HOME", pathlib.Path.home() / ".cargo"))
          registry = cargo_home / "registry"
          index = next((registry / "index").glob("index.crates.io-*"))
          cache = registry / "cache" / index.name
          cache.mkdir(parents=True, exist_ok=True)
          selected = {}
          # Selection uses only this public repository's lockfile and crates.io.
          # Include nearby versions so unrelated embedding hosts can retain locks.
          for package in tomllib.loads(pathlib.Path("Cargo.lock").read_text())["package"]:
              if not package.get("source", "").startswith("registry+"):
                  continue
              name, version = package["name"], package["version"]
              prefix = "1" if len(name) == 1 else "2" if len(name) == 2 else "3/" + name[0] if len(name) == 3 else name[:2] + "/" + name[2:4]
              entries = []
              for part in (index / ".cache" / prefix / name).read_bytes().split(b"\0"):
                  if part.startswith(b"{"):
                      entry = json.loads(part)
                      if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", entry["vers"]) and not entry.get("yanked", False):
                          entries.append(entry)
              major = version.split(".", 1)[0]
              entries = sorted((e for e in entries if e["vers"].split(".", 1)[0] == major), key=lambda e: tuple(map(int, e["vers"].split("."))))
              position = next((i for i, e in enumerate(entries) if e["vers"] == version), None)
              candidates = entries[-3:]
              if position is not None:
                  candidates += entries[max(0, position - 3):position + 4]
              for entry in candidates:
                  selected[(name, entry["vers"])] = entry["cksum"]
          def fetch(item):
              (name, version), checksum = item
              target = cache / f"{name}-{version}.crate"
              if target.exists():
                  if hashlib.sha256(target.read_bytes()).hexdigest() != checksum:
                      raise RuntimeError(f"cached checksum mismatch: {name}-{version}")
                  return 0
              for attempt in range(3):
                  try:
                      url = f"https://static.crates.io/crates/{name}/{name}-{version}.crate"
                      with urllib.request.urlopen(url, timeout=90) as response:
                          data = response.read()
                      if hashlib.sha256(data).hexdigest() != checksum:
                          raise RuntimeError(f"download checksum mismatch: {name}-{version}")
                      target.write_bytes(data)
                      return len(data)
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(attempt + 1)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              size = sum(pool.map(fetch, selected.items()))
          print(f"Verified {len(selected)} public crate versions; downloaded {size} bytes")
          PY_CACHE
      - name: Package pinned compiler and public crate cache
        run: |
          set -euo pipefail
          mkdir -p local-validation/registry
          task_rust_root="$(dirname "$(dirname "$(rustup which rustc)")")"
          cp -a "$task_rust_root" local-validation/rust
          task_hypermem_rust_root="$(dirname "$(dirname "$(rustup which --toolchain 1.98.0 rustc)")")"
          cp -a "$task_hypermem_rust_root" local-validation/rust-1.98.0
          rustup run 1.98.0 rustc -vV > local-validation/rustc-1.98.0.txt
          rustup run 1.98.0 cargo -V > local-validation/cargo-1.98.0.txt
          task_registry="${CARGO_HOME:-$HOME/.cargo}/registry"
          cp -a "$task_registry/cache" local-validation/registry/cache
          cp -a "$task_registry/index" local-validation/registry/index
          git rev-parse HEAD > local-validation/candidate-sha.txt
          rustc -vV > local-validation/rustc.txt
          cargo -V > local-validation/cargo.txt
          tar -czf local-validation.tar.gz -C local-validation .
          sha256sum local-validation.tar.gz > local-validation.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typed-record-local-toolchain-${{ github.sha }}
          path: |
            local-validation.tar.gz
            local-validation.tar.gz.sha256
          compression-level: 0
          retention-days: 3
