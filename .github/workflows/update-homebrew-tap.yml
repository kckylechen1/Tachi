name: Re-promote Homebrew Tap (manual)

# Manual re-promote of an **already published** private release asset onto the
# public homebrew-tachi tap. The automatic tag path is
# `release-cli-binaries.yml` (build → private release → promote) under #728.
#
# Use this when you only need to re-run formula rewrite / re-upload without a rebuild.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote (without leading v); must already have private release assets"
        required: true

jobs:
  promote-public-binary:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SOURCE_REPO: kckylechen1/tachi
      TAP_REPO: kckylechen1/homebrew-tachi
    steps:
      - name: Check required secret
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN is not configured."
            echo "Create a fine-grained PAT with Contents: Read and Write on $TAP_REPO."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve version
        id: version
        run: |
          python3 scripts/check_release_versions.py
          version="${{ inputs.version }}"
          version="${version#v}"
          cargo_version=$(python3 -c 'from pathlib import Path; import re; text = Path("crates/tachi-server/Cargo.toml").read_text(); match = re.search(r"^version\s*=\s*\"([^\"]+)\"", text, re.MULTILINE); print(match.group(1) if match else "")')
          if [ -z "$version" ]; then
            echo "version input required"
            exit 1
          fi
          if [ "$version" != "$cargo_version" ]; then
            echo "WARNING: input version ($version) != Cargo.toml ($cargo_version) — promoting input as requested (re-promote older tag)."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Promote binary + rewrite formula
        env:
          SOURCE_REPO: ${{ env.SOURCE_REPO }}
          TAP_REPO: ${{ env.TAP_REPO }}
          SOURCE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TRIPLE: aarch64-apple-darwin
        run: |
          chmod +x scripts/promote_homebrew_binaries.sh
          scripts/promote_homebrew_binaries.sh "${{ steps.version.outputs.version }}"
