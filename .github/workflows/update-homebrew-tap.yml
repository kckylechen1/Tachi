name: Update Homebrew Tap (public binary)

# Promotes private release binaries onto the public homebrew-tachi tap and
# rewrites Formula/tachi.rb for unauthenticated install (#728 / #874).
#
# Trigger after a private `v*` tag has platform assets:
#   tachi-vX.Y.Z-aarch64-apple-darwin.tar.gz
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote (without leading v)"
        required: false

jobs:
  promote-public-binary:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SOURCE_REPO: kckylechen1/tachi
      TAP_REPO: kckylechen1/homebrew-tachi
    steps:
      - name: Check required secret
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN is not configured."
            echo "Create a fine-grained PAT with Contents: Read and Write on $TAP_REPO."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve version
        id: version
        run: |
          python3 scripts/check_release_versions.py

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          cargo_version=$(python3 -c 'from pathlib import Path; import re; text = Path("crates/memory-server/Cargo.toml").read_text(); match = re.search(r"^version\s*=\s*\"([^\"]+)\"", text, re.MULTILINE); print(match.group(1) if match else "")')

          if [ -z "$cargo_version" ]; then
            echo "Could not find memory-server version in Cargo.toml."
            exit 1
          fi

          if [ -z "$version" ]; then
            version="$cargo_version"
          fi

          if [ "$version" != "$cargo_version" ]; then
            echo "Tag/workflow version ($version) does not match crates/memory-server/Cargo.toml ($cargo_version)."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Promote binary + rewrite formula
        env:
          SOURCE_REPO: ${{ env.SOURCE_REPO }}
          TAP_REPO: ${{ env.TAP_REPO }}
          # Read private release assets from this repo.
          SOURCE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Write public formula + assets on homebrew-tachi.
          TAP_GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          chmod +x scripts/promote_homebrew_binaries.sh
          scripts/promote_homebrew_binaries.sh "${{ steps.version.outputs.version }}"
