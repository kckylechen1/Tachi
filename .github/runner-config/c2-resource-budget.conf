[Unit]
StartLimitIntervalSec=600
StartLimitBurst=3

[Service]
# This runner shares unified memory with TensorFold. Limit CI, not inference.
CPUQuota=400%
MemoryHigh=12G
MemoryMax=16G
MemorySwapMax=2G
# A failed compiler must fail its job, not automatically stop the listener.
OOMPolicy=continue
Restart=on-failure
RestartSec=30s
Environment=CARGO_BUILD_JOBS=2
Environment=NEXTEST_TEST_THREADS=4
Environment=RUST_TEST_THREADS=4
