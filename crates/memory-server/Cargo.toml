[package]
name = "memory-server"
version = "1.6.4"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
memory-core = { path = "../memory-core" }
memory-server-capture-gate = { path = "../memory-server-capture-gate" }
memory-server-params = { path = "../memory-server-params" }
memory-server-rescue = { path = "../memory-server-rescue" }
memory-server-runtime = { path = "../memory-server-runtime" }
tachi-bootstrap = { path = "../tachi-bootstrap" }
tachi-dispatch = { path = "../tachi-dispatch" }
tachi-foundry = { path = "../tachi-foundry" }
tachi-hub = { path = "../tachi-hub" }
tachi-llm = { path = "../tachi-llm" }
tachi-clean = { path = "../../tools/cleaner" }
rmcp = { version = "1.2", features = ["server", "transport-io", "macros", "client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "server-side-http", "transport-streamable-http-server", "schemars"] }
# `http` is needed at the stdio proxy transport layer to forward the bound
# project identity (X-Tachi-Project) to the daemon via rmcp's custom_headers
# builder. Pinned to `1` to match the `http` version rmcp 1.2+ resolves to.
http = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
async-trait = "0.1"
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
axum = "0.7"
dirs = "5.0"
dotenvy = "0.15"
reqwest = { package = "reqwest", version = "0.13", default-features = false, features = ["charset", "json", "rustls-no-provider", "system-proxy"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
aes-gcm = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
dialoguer = "0.12"
rpassword = "7"
glob = "0.3"
url = "2"
libsimple = "~0.7"

[dev-dependencies]
tempfile = "3"
libsimple = "~0.7"
tachi-llm = { path = "../tachi-llm", features = ["test-support"] }
# `test-util` enables `tokio::time::pause()` / `#[tokio::test(start_paused)]`
# for the ci_watch backoff test (finding #2): it virtualizes the watcher's
# real-time sleeps so the backoff schedule is assertable fast. The feature is
# compiled into the already-locked tokio 1.50.0, so it adds no new crate.
tokio = { version = "1", features = ["test-util", "macros", "rt", "time"] }

[lib]
name = "memory_server"
path = "src/lib.rs"

[[bin]]
name = "memory-server"
path = "src/main.rs"
