[package]
name = "memory-server"
version = "1.6.2"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
memory-core = { path = "../memory-core" }
memory-server-params = { path = "../memory-server-params" }
memory-server-runtime = { path = "../memory-server-runtime" }
tachi-dispatch = { path = "../tachi-dispatch" }
tachi-foundry = { path = "../tachi-foundry" }
tachi-llm = { path = "../tachi-llm" }
tachi-clean = { path = "../../tools/cleaner" }
rmcp = { version = "1.2", features = ["server", "transport-io", "macros", "client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "server-side-http", "transport-streamable-http-server", "schemars"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
async-trait = "0.1"
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
axum = "0.7"
dirs = "5.0"
dotenvy = "0.15"
reqwest = { package = "reqwest", version = "0.13", default-features = false, features = ["charset", "json", "rustls", "system-proxy"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
aes-gcm = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
dialoguer = "0.12"
rpassword = "7"
glob = "0.3"
url = "2"
libsimple = "~0.7"

[dev-dependencies]
tempfile = "3"
libsimple = "~0.7"
tachi-llm = { path = "../tachi-llm", features = ["test-support"] }

[lib]
name = "memory_server"
path = "src/lib.rs"

[[bin]]
name = "memory-server"
path = "src/main.rs"
