[package]
name = "memcore"
version = "1.9.0"
edition = "2021"
description = "MemCore — portable memory kernel (store, schema, hybrid search/scorer, graph, events)"
license = "AGPL-3.0-only"

# Feature layout (portable kernel vs Tachi admin):
#
# - default = ["admin"] keeps today's full Tachi product surface.
# - --no-default-features (or default-features = false) builds the
#   *portable kernel only*: store/search/scorer/schema/events/sandbox.
#   Vault / Hub / Foundry job queue / Pack product APIs are omitted.
# - Since #1585 the DDL is ALSO profile-scoped at runtime: a database created
#   under `StoreProfile::PortableKernel` never gets the product tables at all.
#   A portable build can still open a full Tachi database (TachiFull satisfies
#   a PortableKernel requirement); the reverse is refused with a typed
#   `StoreProfileMismatch`.
#
# Downstream forks (HyperTachi, HyperMemory) should depend via the
# `portable-kernel` facade crate, which disables `admin` by default.
[features]
default = ["admin"]
admin = []

[dependencies]
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
libsimple = "~0.7"
sqlite-vec = { workspace = true }

# Atomic no-clobber rename FFI (renamex_np / renameat2) for the #1226
# cross-process migration TOCTOU close in `db::filename`. Only referenced under
# the same target cfg, so it isn't pulled in on other platforms.
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# receipts_workloads drives admin-side surfaces (raw connection access);
# it is not part of the portable build shape (#1585).
[[example]]
name = "receipts_workloads"
required-features = ["admin"]
