[package]
name = "memcore"
version = "1.9.0"
edition = "2021"
description = "MemCore — portable memory kernel (store, schema, hybrid search/scorer, graph, events)"
license = "AGPL-3.0-only"

# Feature layout (portable kernel vs Tachi admin):
#
# - default = ["admin"] keeps today's full Tachi product surface.
# - --no-default-features (or default-features = false) builds the
#   *portable kernel only*: store/search/scorer/schema/events/sandbox.
#   Vault / Hub / Foundry job queue / Pack product APIs are omitted.
# - Schema DDL still creates admin tables so a portable build can open
#   DBs written by full Tachi (empty tables are fine).
#
# Downstream forks (HyperTachi, HyperMemory) should depend via the
# `portable-kernel` facade crate, which disables `admin` by default.
[features]
default = ["admin"]
admin = []

# #1564 — gates verified-dead-code stacks (zero production callers) behind an
# explicit, default-off feature instead of deleting them outright. Deletion
# is an owner-per-stack call (#1564); this feature only makes each stack's
# on/off state visible and testable, and keeps `default` byte-identical to
# today. Orthogonal to `admin` (portable-kernel axis).
contract-leaves = []

[dependencies]
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
libsimple = "~0.7"
sqlite-vec = { workspace = true }

# Atomic no-clobber rename FFI (renamex_np / renameat2) for the #1226
# cross-process migration TOCTOU close in `db::filename`. Only referenced under
# the same target cfg, so it isn't pulled in on other platforms.
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
