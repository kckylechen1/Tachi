[package]
name = "tachi-build-broker"
version = "1.9.2"
edition = "2021"
rust-version = { workspace = true }
license = "AGPL-3.0-only"
publish = false
description = "Build-broker domain runtime for Tachi: serialized cargo seat, target generations, tickets, and quarantine-aware resource registration (#1702 Track T3, carve 4). Carved out of tachi-server with no MemoryServer coupling."

[lib]
doctest = false

[dependencies]
jiff = { workspace = true }
libc = "0.2"
memcore = { path = "../memcore" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
dirs = "5.0"
tempfile = "3"
