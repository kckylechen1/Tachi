[package]
name = "tachi-server"
version = "1.9.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Tachi server — full product runtime (MemCore + operator surfaces)"

# ─── Build profiles (Refs #924 / #770) ──────────────────────────────────────────
#
# `full` (default) is today's product runtime: memory kernel + every operator
# surface (vault, hub/skill, foundry, dispatch, gh ops, PR lifecycle). It is
# default-on so `cargo check -p tachi-server` and every existing build stay
# byte-identical — no code path changes while `full` is active.
#
# `portable` is the stripped HyperMem-cutover profile: the memory kernel + its
# serving surface ONLY (memory save/search/get/briefing/checkpoint facades,
# stdio + HTTP MCP serving, daemon scope isolation, status). The operator
# crates below are `optional` and pulled in ONLY by `full`, so a `portable`
# build never compiles them into the trading runtime.
#
# NOTE (skeleton, #924): the Cargo dependency partition below is landed, but the
# source-level gates that make `--no-default-features --features portable`
# COMPILE are the staged follow-up (see crate module docs in `src/lib.rs` and
# the issue). Until those land, `portable` selects the reduced dep set but the
# always-compiled source still references the operator crates; `full` remains
# the only compiling profile. Do not ship `portable` as buildable yet.
[features]
default = ["full"]

# Everything that exists today. Keep this list == the set of operator crates so
# the default build is unchanged.
full = [
    "dep:tachi-hub",
    "dep:tachi-foundry",
    "dep:tachi-dispatch",
    "dep:tachi-merge-ops",
    "dep:memory-server-hub-cli",
    "dep:memory-server-manifest-audit",
    "dep:memory-server-rescue",
    "dep:tachi-clean",
]

# Kernel + serving only. Adds no operator crates. Compiling this profile is the
# staged source-gating work tracked by #924.
portable = []

[dependencies]
memcore = { path = "../memcore" }
memory-server-capture-gate = { path = "../memory-server-capture-gate" }
memory-server-hub-cli = { path = "../memory-server-hub-cli", optional = true }
memory-server-manifest-audit = { path = "../memory-server-manifest-audit", optional = true }
tachi-params = { path = "../tachi-params" }
memory-server-prompt-envelope = { path = "../memory-server-prompt-envelope" }
memory-server-rescue = { path = "../memory-server-rescue", optional = true }
memory-server-runtime = { path = "../memory-server-runtime" }
tachi-bootstrap = { path = "../tachi-bootstrap" }
tachi-dispatch = { path = "../tachi-dispatch", optional = true }
tachi-foundry = { path = "../tachi-foundry", optional = true }
tachi-hub = { path = "../tachi-hub", optional = true }
tachi-merge-ops = { path = "../tachi-merge-ops", optional = true }
tachi-llm = { path = "../tachi-llm" }
tachi-clean = { path = "../../tools/cleaner", optional = true }
rmcp = { version = "1.2", features = ["server", "transport-io", "macros", "client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "server-side-http", "transport-streamable-http-server", "schemars"] }
# `http` is needed at the stdio proxy transport layer to forward the bound
# project identity (X-Tachi-Project) to the daemon via rmcp's custom_headers
# builder. Pinned to `1` to match the `http` version rmcp 1.2+ resolves to.
http = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
async-trait = "0.1"
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
axum = "0.7"
dirs = "5.0"
dotenvy = "0.15"
reqwest = { package = "reqwest", version = "0.13", default-features = false, features = ["charset", "json", "rustls-no-provider", "system-proxy"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
aes-gcm = { workspace = true }
argon2 = { workspace = true }
# Cryptographic digest for the #894 S2e postflight workspace manifest
# (`exec_env_postflight`). The worker this gate is aimed at can run arbitrary
# code, so the fingerprint must not be forgeable — a non-cryptographic hash
# (FNV/SipHash) would let a deliberate edit be dressed up as an unchanged file.
# blake2 0.10.6 is ALREADY resolved in this workspace's dependency graph via
# `argon2` (see Cargo.lock), so this adds no new crate to the build, only a
# direct-dependency edge onto something already compiled (same rationale as the
# `icu_properties` edge below).
blake2 = "0.10"
base64 = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
dialoguer = "0.12"
rpassword = "7"
glob = "0.3"
url = "2"
# Unicode `General_Category` lookup (`icu_properties::props::GeneralCategory`)
# for `claims_ops::sanitize_presence_field`'s Cf (Format) strip — real
# category data via `compiled_data` (default feature, no network fetch),
# already resolved in this workspace's dependency graph at this exact version
# via `url` → `idna` → `idna_adapter` (see Cargo.lock), so this adds no new
# crate to the build, only a direct-dependency edge onto data already
# compiled into every build.
icu_properties = "2.2"
# Shared vault crypto + versioned KDF-parameter format (tachi#1080 v1);
# `vault_crypto.rs` is now a thin re-export of this crate. Plain here (no
# `test-support`) so real builds use the production Argon2 profile; see the
# `[dev-dependencies]` entry below for the test-only fast profile.
vault-kit = { path = "../vault-kit" }

[dev-dependencies]
tempfile = "3"
tachi-llm = { path = "../tachi-llm", features = ["test-support"] }
# Dev-dep only, so `cargo build --release` never sees this feature. It
# makes vault-kit's `test_support::derive_cheap` (m=64 KiB vs the
# production m=65536 KiB) available to tachi-server's own test binary; it
# does not make the ordinary `derive()` calls in the same test binary
# cheap — those still run the production Argon2 profile (see vault-kit's
# Cargo.toml feature docs).
vault-kit = { path = "../vault-kit", features = ["test-support"] }
# `test-util` enables `tokio::time::pause()` / `#[tokio::test(start_paused)]`
# for the ci_watch backoff test (finding #2): it virtualizes the watcher's
# real-time sleeps so the backoff schedule is assertable fast. The feature is
# compiled into the already-locked tokio 1.50.0, so it adds no new crate.
tokio = { version = "1", features = ["test-util", "macros", "rt", "time"] }

[lib]
name = "tachi_server"
path = "src/lib.rs"

# Primary product binary name. Keeps the default test/bench targets.
[[bin]]
name = "tachi-server"
path = "src/main.rs"

[[bin]]
name = "github-corpus-pilot"
path = "src/bin/github_corpus_pilot.rs"

# Install/PATH compatibility alias for the MemCore/Tachi brand rename
# (#912 / #890). Compiles the SAME `src/main.rs`, so with default flags
# `cargo test` / `cargo nextest run` / `--all-targets` / `cargo bench` would
# build a byte-identical second copy of this (test-free, bench-free) main.rs.
# `test = false` / `bench = false` drop that redundant copy (Refs #1095).
#
# Equivalence -- the release binary SET and the tested test SET are both
# unchanged:
#   * src/main.rs has NO `#[cfg(test)]` / `#[test]` / `mod tests` (verified by
#     grep), so disabling this bin's TEST target removes ZERO tests; the only
#     thing removed is duplicate compilation/linking of an empty test harness.
#   * `test` / `bench` affect only test/bench TARGET discovery -- `cargo build`
#     and `cargo build --release` still produce the bin ARTIFACT, so release
#     packaging (scripts/package_release_binary.sh -> the `tachi` binary) and
#     the install/PATH surface are unchanged.
#   * No `CARGO_BIN_EXE_*` reference exists anywhere in the repo (verified by
#     grep, zero hits), so no integration test depends on this bin's test
#     target; and there is no `[[bench]]` / `#[bench]` in this crate, so
#     `bench = false` removes nothing.
#
# The `memory-server` [[bin]] alias that used to live here (the #890/#912
# brand-rename PATH-compat shim) is retired (tachi#1132, owner-ratified
# 2026-07-17): it was compiled on every release build but never distributed —
# scripts/package_release_binary.sh builds/installs only `tachi`, and the
# Homebrew formula's only install line is `bin.install "tachi"`. Not to be
# confused with the Hyperion fork's own, unrelated `memory-server` crate.
[[bin]]
name = "tachi"
path = "src/main.rs"
test = false
bench = false
