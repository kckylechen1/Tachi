[package]
name = "portable-kernel"
version = "1.9.0"
edition = "2021"
description = "Portable facade over memcore with Tachi admin features disabled"
license = "AGPL-3.0-only"
publish = false

# This facade depends on memcore *without* the admin feature.
# Operator surfaces (vault secrets, Hub catalog, Foundry job queue, Pack)
# are intentionally absent so embedders can use the memory kernel without
# pulling Tachi product APIs.
#
# Historical provenance: this boundary was introduced for HyperTachi and
# HyperMemory convergence. Per #1195, it is retained as a candidate boundary
# for a future ZeroClaw-native module. No direct ZeroClaw Cargo integration is
# present today.
#
# Since #1585 a database this crate CREATES carries only the portable kernel
# schema (no product tables). It can still open a full Tachi database — the
# profile lattice makes TachiFull satisfy a PortableKernel requirement — and
# such a store keeps being migrated as TachiFull, never re-shaped.
[dependencies]
memcore = { path = "../memcore", default-features = false }

[features]
# Enables the isolated integration test that proves this facade resolves
# `memcore` without the full product's `admin` feature. It must not be enabled
# by the workspace-wide test build, where Cargo intentionally unifies features
# for the shared memcore package.
portable-contract-test = []

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"

[[test]]
name = "portable_contract"
path = "tests/portable_contract.rs"
required-features = ["portable-contract-test"]

# tachi#1348-A: exact-dedupe plan/apply/restore goldens, gated the same way
# and for the same reason as `portable_contract` above.
[[test]]
name = "exact_dedupe_contract"
path = "tests/exact_dedupe_contract.rs"
required-features = ["portable-contract-test"]

[[test]]
name = "outbox_destination_apply_contract"
path = "tests/outbox_destination_apply_contract.rs"
required-features = ["portable-contract-test"]
