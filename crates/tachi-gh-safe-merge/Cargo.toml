[package]
name = "tachi-gh-safe-merge"
version = "1.9.2"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Pure GitHub safe-merge gate, type, and client contracts extracted from tachi-server."

[features]
# Test doubles are available to downstream crate tests only when they opt in;
# normal product builds never compile this fixture surface.
test-support = []

[dependencies]
async-trait = "0.1"
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
