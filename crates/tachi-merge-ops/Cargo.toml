[package]
name = "tachi-merge-ops"
version = "1.7.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Tachi merge-ops — local worktree merge toolkit (approve_merge, safety gates, cleaner integration)."

[dependencies]
tachi-params = { path = "../tachi-params" }
tokio = { version = "1", features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
