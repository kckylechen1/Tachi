[package]
name = "tachi-delivery-tests"
version = "1.9.2"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "External durable delivery seam tests extracted from tachi-server (#1831 Track T)."

[dependencies]

[dev-dependencies]
memcore = { path = "../memcore", features = ["test-support"] }
serde_json = { workspace = true }
tachi-params = { path = "../tachi-params" }
tachi-server = { path = "../tachi-server", features = ["delivery-test-api"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
