[package]
name = "tachi-params"
version = "1.9.2"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
memcore = { path = "../memcore" }
chrono = { workspace = true }
# Typed error enums for the taskintent bridge module (tachi#1840). Already a
# workspace dependency compiled for memcore; this adds no new crate to the
# build, only a direct-dependency edge.
thiserror = { workspace = true }
# rusqlite for the taskintent bridge's read-only ingest adapter over
# existing dispatch_outcomes truth (tachi#1840). Already resolved in this
# workspace's dependency graph (memcore's store layer); direct edge only.
rusqlite = { workspace = true }
rmcp = { version = "1.2", features = ["schemars"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# Cryptographic SHA-256 for the #1002 Issue Refinery's frozen hashing contract
# (issue body hash / canonical-JSON snapshot hash — docs/engineering/architecture/
# issue-refinery-memory-lanes.md §5 requires SHA-256 specifically, not a
# non-cryptographic hash). `ring` 0.17 is ALREADY resolved in this workspace's
# dependency graph (it is the rustls crypto provider selected via
# `rustls = { features = ["ring"] }` at the workspace level — see root
# Cargo.toml), so this adds no new crate to the build, only a direct-dependency
# edge onto something already compiled (same rationale as the `blake2`/`argon2`
# edge in tachi-server's Cargo.toml).
ring = "0.17"
blake2 = "0.10"
