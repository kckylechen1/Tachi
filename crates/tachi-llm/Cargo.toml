[package]
name = "tachi-llm"
version = "1.8.0"
edition = "2021"
license = "AGPL-3.0-only"

[features]
default = []
test-support = []

[dependencies]
memcore = { path = "../memcore" }
chrono = { workspace = true }
dirs = "5.0"
reqwest = { package = "reqwest", version = "0.13", default-features = false, features = ["charset", "json", "rustls-no-provider", "system-proxy"] }
rusqlite = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = "0.7"
tempfile = "3"
