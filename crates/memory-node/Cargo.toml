[package]
name = "memory-node"
version = "1.9.1"
edition = "2021"
description = "NAPI-RS Node.js binding for memcore"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
memcore = { path = "../memcore" }
napi = { version = "2", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "2"
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"
