[package]
name = "vault-kit"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Shared Argon2id + AES-256-GCM vault crypto primitives and versioned KDF-parameter format, extracted for cross-product reuse (tachi#1080)."
publish = false

# Leaf crate: crypto + versioned format ONLY (tachi#1080 v1 scope, adjudicated
# after adversarial review rejected the wider "crypto+store" v0 extraction —
# see the issue for the full history). Deliberately depends on nothing else
# in this workspace (not memcore, not tachi-server) so a downstream fork can
# pin this crate alone without pulling product code.
[dependencies]
aes-gcm = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
# Purely additive, opt-in only: enables the separate
# `test_support::derive_cheap` / `test_support::cheap_kdf_params_json`
# helpers (m=64 KiB, t=1, p=1 — sub-millisecond) as an explicit alternative
# to the ordinary derive path. It never swaps what `derive()` /
# `active_kdf_params_json()` return — those two always run the production
# Argon2 profile (m=65536 KiB, t=3, p=4 — ~100-300ms/call), in every build
# mode, whether this feature is on or off. A caller that wants the cheap
# profile in its own tests calls `test_support::derive_cheap` explicitly;
# ordinary `derive()` calls in the same test binary are unaffected and
# still pay full production cost. Cargo's dev-dependency feature
# unification (only applies when a test/bench/example target is actually
# built) can pull this feature into a downstream crate's own test builds —
# e.g. tachi-server's `[dev-dependencies]` entry — without that downstream
# crate needing to depend on vault-kit twice.
test-support = []
