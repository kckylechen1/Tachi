version: 2026-06-15
release: v1.8.0

status:
  phase_1_hub_governance: done
  phase_2_sandbox_executor: done
  phase_3_ghost_persistence: done
  phase_4_virtual_capability: done
  phase_5_multi_agent_ops: done
  phase_6_production_hardening: done
  app_installer_loop: not_done
  electron_shell: not_done

why:
  - callers should target logical capabilities instead of provider-specific ids
  - routing, audit, policy, and version pinning should move into platform side
  - app layer needs a single install/governance/runtime loop for MCP/plugin assembly
  - multi-agent coordination needs first-class primitives (handoff, identity, rate limiting)

implemented_now:
  virtual_capability:
    tools:
      - vc_register
      - vc_bind
      - vc_list
      - vc_resolve
    routing:
      - hub_call accepts vc ids
      - resolves to concrete mcp capability
      - returns requested and resolved ids
    policy:
      - concrete policy preferred
      - requested virtual capability policy used as fallback
    storage:
      - hub_capabilities.type=virtual
      - virtual_capability_bindings
    guards:
      - cross-scope VC shadowing check on register

  project_db:
    tools:
      - tachi_init_project_db
    default_path: .tachi/memory.db
    hot_swap:
      - activate_project_db() on MemoryServer
      - has_project_db() / with_hot_project_store()
      - no daemon restart required
      - ~30 callsites migrated from static check

  hub_export_skills:
    tools:
      - hub_export_skills
    agents:
      - claude: SKILL.md + symlinks
      - openclaw: plugin manifest JSON
      - cursor: .mdc rules
      - generic: raw files
    features:
      - visibility filtering
      - agent-local scope filtering
      - clean mode (wipe before export)

  rate_limiter:
    type: per-session sliding window
    features:
      - RPM limit (default 0 = unlimited)
      - burst/loop detection (same tool+args, default threshold 8)
      - configurable via RATE_LIMIT_RPM / RATE_LIMIT_BURST env vars
      - "per-agent override slot exists (AgentProfile.rate_limit_rpm/burst) but is unreachable since issue 757 (no facade sets it); all sessions use the global env default"

  skill_evolve:
    tools:
      - skill_evolve
    features:
      - LLM-powered prompt improvement
      - creates versioned capability (skill:name/vN)
      - optional auto-activation via hub_version_routes
      - feedback recording in handle_run_skill

  agent_profile:
    tools: []
    features:
      - "agent_register/agent_whoami retired under issue 757; no facade currently writes AgentProfile state at runtime"
      - "AgentProfile struct + Arc<RwLock<Option<AgentProfile>>> slot still exists for consumers (provenance, handoff from_agent, rate-limit overrides, Foundry attribution) but always reads None in production"
      - "each consumer degrades gracefully to a non-agent_profile fallback (TACHI_PROFILE env, unknown-agent/system/tachi_scheduler sentinels, or global RATE_LIMIT_RPM/BURST env default); no crash, but per-agent identity/rate-limit-override granularity is gone"

  cross_agent_handoff:
    tools:
      - handoff_leave
      - handoff_check
    features:
      - target filtering by agent name
      - acknowledgment tracking
      - priority levels (low, normal, high, critical)
      - memory persistence (handoff: category)
      - LRU eviction at 50 memos

  dispatch_v2:
    stages: brainstorm / plan / dispatch / review / ship
    features:
      - two-stage plan/execute with plan review gate
      - tachi_shell orchestration facade
      - tachi_task dispatch + kanban board
      - auto-daemon readiness probe
      - watchdog polling for kanban state

  docs_organizer:
    tools:
      - docs_organize (wiki-based document management)
    features:
      - hierarchical directory structure
      - frontmatter-based metadata
      - category classification with LLM assist
      - archive management
      - path traversal protection

  production_hardening:
    audit_rounds: P0/P1/P2/P3 + Gemini review
    fixes_applied:
      - atomic file writes (write-to-tmp + rename + flock)
      - crypto interceptor anti-debug bypass
      - tracing migration (eprintln -> tracing)
      - scoring normalization (Jaccard, surprise_score)
      - daemon lock TOCTOU fix
      - Retry-After header compliance
      - capture gate bucket registry
      - health score dimension mismatch penalty

desktop:
  base_url_default: http://127.0.0.1:6919/mcp
  dev_proxy: /tachi/mcp
  status: runnable_prototype
  missing:
    - installer_plan
    - review_queue
    - vc_mapping_ui
    - smoke_test_rollback_flow
    - electron_shell_daemon_lifecycle

sandbox:
  current_behavior:
    - cwd_roots enforced with canonicalized path comparison
    - fs_read_roots and fs_write_roots are fail_closed for stdio process runtime
  rationale:
    - do not claim isolation stronger than runtime can actually enforce

tests:
  total: 44
  all_passing: true
